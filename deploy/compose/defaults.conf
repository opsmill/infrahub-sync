# Infrahub Sync Compose bundle — shipped non-secret defaults.
#
# Nothing here is a secret and nothing here is operator-specific. Credentials,
# the image reference, and the connection strings live in the operator-owned
# `operator.env`, which the lifecycle entry point creates and Git ignores.
#
# This file is not named `*.env` on purpose: the repository ignores that suffix
# so an operator's own file cannot be committed by accident, and these defaults
# have to stay tracked for the bundle to work from a fresh copy.
#
# Keep values UNQUOTED. `docker compose --env-file` strips quotes; a quoted
# value would mean one thing to Compose and another to anything else that reads
# this file with a plain KEY=VALUE parser.

# Host publication. Both published surfaces bind to loopback: external exposure
# and TLS termination are explicit non-goals of the supported single-host shape.
INFRAHUB_SYNC_BIND_ADDRESS=127.0.0.1
INFRAHUB_SYNC_API_PORT=8000
INFRAHUB_SYNC_PREFECT_PORT=4200

# PostgreSQL. The administrator owns nothing the deployment runs as; it exists
# to create the two owner roles and their two databases and is then unused.
INFRAHUB_SYNC_POSTGRES_ADMIN_ROLE=postgres
INFRAHUB_SYNC_PRODUCT_DATABASE=infrahub_sync
INFRAHUB_SYNC_PRODUCT_ROLE=infrahub_sync
INFRAHUB_SYNC_PREFECT_DATABASE=prefect
INFRAHUB_SYNC_PREFECT_ROLE=prefect

# Object storage.
INFRAHUB_SYNC_S3_BUCKET=infrahub-sync
INFRAHUB_SYNC_S3_PREFIX=infrahub-sync
INFRAHUB_SYNC_S3_REGION=us-east-1

# Prefect work pool the deployment, the worker, and the API all name.
INFRAHUB_SYNC_WORK_POOL=infrahub-sync

# Liveness. The API derives its stall and freshness thresholds from the worker
# query interval, and ages a worker out of the live set after three missed
# heartbeats or thirty seconds, whichever is longer.
INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS=300
PREFECT_WORKER_QUERY_SECONDS=10
PREFECT_WORKER_HEARTBEAT_SECONDS=10

# The declared configuration package the bootstrap job registers. Point this at
# your own package file; the shipped one is the qualification configuration.
INFRAHUB_SYNC_BOOTSTRAP_CONFIGURATION=./configuration/qualification.yaml
