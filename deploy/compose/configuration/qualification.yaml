---
# An example declared configuration. Nothing loads it: a deployment starts with
# an empty registry, and this file becomes a configuration only when an operator
# registers it explicitly through the Sync API.
#
# Both adapters are the bundled `infrahub` one, so a registered run resolves
# them from installed code: nothing is generated, and no worker filesystem is
# consulted. The token is a credential *reference* — the worker resolves
# `INFRAHUB_API_TOKEN` from its own environment, so no secret value is declared
# here, stored in PostgreSQL, or printed by any lifecycle command.
#
# Edit `url` to name your own Infrahub before registering it, or register a
# package file of your own instead:
#
#   ./infrahub-sync-compose cli --package ./package.yml -- \
#     configs register /input/package.yaml --reason 'register my configuration'
#
# A registered version is immutable. To change a registered configuration, edit
# your own copy and register the edit as the next version of it:
#
#   ./infrahub-sync-compose cli --package ./package.yml -- \
#     configs version CONFIG_ID /input/package.yaml --reason 'register edited configuration'
#
# The schema this maps is the one Infrahub Sync ships for its own qualification:
# examples/prefect_remote_run/schemas/infra_device.yml
format_version: 1
configuration:
  name: infrahub-sync-qualification
  source:
    name: infrahub
    settings:
      url: "http://infrahub.example.net:8000"
      branch: main
      token:
        $credential: infrahub-token
  destination:
    name: infrahub
    settings:
      url: "http://infrahub.example.net:8000"
      branch: infrahub-sync-qualification
      token:
        $credential: infrahub-token
  schema_mapping:
    - name: InfraDevice
      mapping: InfraDevice
      identifiers: ["name"]
      fields:
        - name: name
          mapping: name
        - name: type
          mapping: type
credentials:
  infrahub-token:
    provider: env
    identifier: INFRAHUB_API_TOKEN
