---
# yamllint disable rule:truthy
version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "type/housekeeping"
      # Dependency bumps carry no behaviour change of their own, so they are
      # exempt from the news-fragment gate in changelog-check.yml.
      - "ci/skip-changelog"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "type/housekeeping"
      # Dependency bumps carry no behaviour change of their own, so they are
      # exempt from the news-fragment gate in changelog-check.yml.
      - "ci/skip-changelog"
    groups:
      all:
        patterns:
          - "*"
