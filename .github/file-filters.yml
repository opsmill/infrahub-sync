---
python_all: &python_all
  - "**/*.py"
  - "pyproject.toml"
  - "uv.lock"

doc_files: &doc_files
  - "docs/**"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

sync_files: &sync_files
  - "infrahub_sync/**"
  - "opsmill_prefect_extras/**"

test_files: &test_files
  - "tests/**"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

development_files: &development_files
  - "tasks/**"

# Several unit tests read fixtures under here at runtime (config parsing, plan
# artifacts, the example-hygiene and dependency-graph suites), so a change here
# can break the unit or base-install jobs without touching `infrahub_sync/**`.
examples_files: &examples_files
  - "examples/**"
# Inputs to tests/test_release_label_contract.py, so a change to the label
# gate or the configuration it asserts still runs the unit tests. This file is
# listed too, so a change to the routing itself runs them.
release_label_files: &release_label_files
  - "scripts/check_release_labels.py"
  - ".github/file-filters.yml"
  - ".github/version-drafter.yml"
  - ".github/labels.yml"
  - ".github/dependabot.yml"
  - ".github/workflows/release-label-check.yml"
  - ".github/workflows/trigger-push-stable.yml"
  - ".github/workflows/update-infrahub-sdk.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

# What `tests/test_workflow_contracts.py` reads: every workflow declaration, this
# document, and the Dockerfile whose COPY lines one of its cases expands. A change
# to any of them changes what that suite asserts, so the suite has to re-run.
contract_declarations: &contract_declarations
  - ".github/workflows/**"
  - ".github/scripts/nightly_e2e.py"
  - ".github/file-filters.yml"
  - "Dockerfile"

uv_files: &uv_files
  - "pyproject.toml"
  - "uv.lock"

sync_all:
  - *sync_files
  - *test_files
  - *development_files
  - *release_label_files
  - *uv_files
  - *contract_declarations
  - *examples_files

documentation_all:
  - *doc_files
  - *markdown_all

# What the image gate (`ci-docker-image.yml`) rebuilds for: the build
# context the Dockerfile copies, the dependency set it installs, the root
# Compose file the smoke test starts, and the smoke suite itself. The last three
# entries are the gate's own declarations, so re-aiming it faces the gate it
# aims.
image_inputs:
  - "Dockerfile"
  - ".dockerignore"
  - "pyproject.toml"
  - "uv.lock"
  - "infrahub_sync/**"
  - "opsmill_prefect_extras/**"
  - "docker-compose.yml"
  - "tests/image/**"
  - ".github/workflows/ci-docker-image.yml"
  - ".github/workflows/trigger-pr-develop.yml"
  - ".github/file-filters.yml"
