---
python_all: &python_all
  - "**/*.py"
  - "pyproject.toml"
  - "uv.lock"

doc_files: &doc_files
  - "docs/**"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

sync_files: &sync_files
  - "infrahub_sync/**"
  - "opsmill_prefect_extras/**"

test_files: &test_files
  - "tests/**"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

development_files: &development_files
  - "tasks/**"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

# What `tests/test_workflow_contracts.py` reads: every workflow declaration, this
# document, and the Dockerfile whose COPY lines one of its cases expands. A change
# to any of them changes what that suite asserts, so the suite has to re-run.
contract_declarations: &contract_declarations
  - ".github/workflows/**"
  - ".github/file-filters.yml"
  - "Dockerfile"

uv_files: &uv_files
  - "pyproject.toml"
  - "uv.lock"

image_files: &image_files
  - "Dockerfile"
  - ".dockerignore"
  - "vulnerability-waivers.yml"
  # Build-context inputs rather than documentation here: the Dockerfile copies
  # both into the wheel's build, so a change to either changes the image the gate
  # would qualify. `tests/test_workflow_contracts.py` reads the Dockerfile's own
  # COPY lines and fails if an input stops being named.
  - "README.md"
  - "LICENSE.txt"
  - "tests/image/**"
  - ".github/workflows/workflow-image.yml"
  # And this document, because `image_all` below is what selects the image job
  # and the checkout-free clean-host job. Re-aiming that selection is the one
  # change most able to hide a regression, so it has to face the gate it aims.
  # The exact path only: `.github/workflows/**` would rebuild and rescan the
  # image for an edit to an unrelated workflow.
  - ".github/file-filters.yml"

# The Compose bundle is qualified in the image gate's own job, against the image
# that job just built, so a change to the bundle or its suites re-runs the gate.
compose_files: &compose_files
  - "deploy/compose/**"
  - "tests/compose/**"

# The clean-host kit's inputs that live outside the trees above. `release.kit`
# copies these exact files into the kit a bare host runs, so a change to one
# changes what the clean-host matrix qualifies against. Named file by file
# rather than by directory, because the rest of `development/` and `examples/`
# is not image-gate input and must not be routed into it.
qualification_kit_files: &qualification_kit_files
  - "development/docker-compose.infrahub.yml"
  - "development/docker-compose.preview.yml"
  - "development/preview.env"
  - "examples/prefect_remote_run/schemas/infra_device.yml"

sync_all:
  - *sync_files
  - *test_files
  - *development_files
  - *uv_files
  - *contract_declarations

documentation_all:
  - *doc_files
  - *markdown_all

# The image gate rebuilds and rescans, so it runs for the image itself, the
# scanner policy, and the dependency set it installs. It runs its steps through
# Invoke, so it takes the whole task tree rather than the one module it is
# about: the entry point that registers that module, and everything it imports,
# decide what `invoke image.*` actually does.
image_all:
  - *image_files
  - *compose_files
  - *qualification_kit_files
  - *sync_files
  - *development_files
  - *uv_files
