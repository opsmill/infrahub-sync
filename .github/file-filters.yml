---
python_all: &python_all
  - "**/*.py"

doc_files: &doc_files
  - "docs/**"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

sync_files: &sync_files
  - "infrahub_sync/**"
  - "opsmill_prefect_extras/**"

test_files: &test_files
  - "tests/**"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

development_files: &development_files
  - "tasks/**"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

uv_files: &uv_files
  - "pyproject.toml"
  - "uv.lock"

image_files: &image_files
  - "Dockerfile"
  - ".dockerignore"
  - "tasks/image.py"
  - "vulnerability-waivers.yml"
  - "tests/image/**"
  - ".github/workflows/workflow-image.yml"

sync_all:
  - *sync_files
  - *test_files
  - *development_files
  - *uv_files

documentation_all:
  - *doc_files
  - *markdown_all

# The image gate rebuilds and rescans, so it runs for the image itself, its
# packaging task, the scanner policy, and the dependency set it installs.
image_all:
  - *image_files
  - *uv_files
