---
python_all: &python_all
  - "**/*.py"
  - "pyproject.toml"
  - "uv.lock"

doc_files: &doc_files
  - "docs/**"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

sync_files: &sync_files
  - "infrahub_sync/**"

test_files: &test_files
  - "tests/**"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

development_files: &development_files
  - "tasks/**"

# Inputs to tests/test_release_label_contract.py, so a change to the label
# gate or the configuration it asserts still runs the unit tests.
release_label_files: &release_label_files
  - "scripts/**"
  - ".github/version-drafter.yml"
  - ".github/labels.yml"
  - ".github/dependabot.yml"
  - ".github/workflows/release-label-check.yml"
  - ".github/workflows/update-infrahub-sdk.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

uv_files: &uv_files
  - "pyproject.toml"
  - "uv.lock"

sync_all:
  - *sync_files
  - *test_files
  - *development_files
  - *release_label_files
  - *uv_files

documentation_all:
  - *doc_files
  - *markdown_all
