---
# yamllint disable rule:truthy
name: "Run Unit & Integration Tests"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    outputs:
      sync: ${{ steps.changes.outputs.sync_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  unit-tests:
    name: "Unit Tests (py${{ matrix.python-version }})"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.sync == 'true'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "latest"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: "Install dependencies"
        run: uv sync --frozen --extra dev

      # Runs only `-m "not integration"`. Integration tests need a live
      # Infrahub instance and are opted into via `invoke tests-integration`
      # (run locally; not gated here yet — TODO: add Infrahub service
      # container or compose stack and a separate integration-tests job).
      - name: "pytest: unit tests"
        run: uv run invoke tests.tests-unit
