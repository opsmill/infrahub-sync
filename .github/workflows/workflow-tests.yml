---
# yamllint disable rule:truthy
name: "Run Unit & Integration Tests"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

# `github.workflow` is the caller's name inside a reusable workflow, so a group
# built from it alone is shared with every sibling the same caller starts. The
# linter writes exactly that, and this workflow now starts beside it rather than
# after it, so the literal below is what keeps the two from cancelling each
# other while still cancelling a stale run of this one.
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    outputs:
      sync: ${{ steps.changes.outputs.sync_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  unit-tests:
    name: "Unit Tests (py${{ matrix.python-version }})"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.sync == 'true'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "latest"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: "Install direct Prefect dependencies on Python 3.10"
        if: matrix.python-version == '3.10'
        run: uv sync --python 3.10 --frozen --extra dev --extra prefect

      # The Sync HTTP service is Python 3.11+; the separate 3.10 leg still proves
      # the direct Prefect orchestration profile.
      - name: "Install service dependencies on Python 3.11+"
        if: matrix.python-version != '3.10'
        run: uv sync --python ${{ matrix.python-version }} --frozen --extra dev --extra prefect --extra service

      # Runs only `-m "not integration"`. Integration tests need a live
      # Infrahub instance and are opted into via `invoke tests-integration`
      # (run locally; not gated here yet — TODO: add Infrahub service
      # container or compose stack and a separate integration-tests job).
      - name: "pytest: unit tests"
        run: uv run invoke tests.tests-unit

  # The unit tier above excludes `integration`, so nothing there touches a real
  # PostgreSQL server. This job runs only the product store's and the admission
  # race's integration tests against a service container, and `tests-product-store-postgresql` fails on
  # any skip, an unset DSN, or an empty selection, so a missing server or driver
  # cannot pass as green.
  product-store-postgresql:
    name: "Product store on PostgreSQL"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.sync == 'true'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRODUCT_STORE_TEST_POSTGRESQL_DSN: "host=127.0.0.1 port=5432 user=postgres password=probe dbname=probe"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "latest"

      - name: "Set up Python 3.13"
        run: uv python install 3.13

      - name: "Install service dependencies"
        run: uv sync --python 3.13 --frozen --extra dev --extra prefect --extra service

      - name: "pytest: product store on PostgreSQL"
        run: uv run --no-sync invoke tests.tests-product-store-postgresql

  base-install-tests:
    # One leg WITHOUT the `prefect` extra. `tests/test_no_prefect_import.py` asserts
    # the base package neither imports nor needs Prefect; only an install where
    # Prefect is genuinely absent proves the base install still imports and the CLI
    # still runs. The flow suite skips here, by design.
    name: "Unit Tests (base install, Python 3.10, no service runtimes)"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.sync == 'true'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v4"
        with:
          version: "latest"

      - name: "Set up Python 3.10"
        run: uv python install 3.10

      - name: "Install dependencies"
        run: uv sync --python 3.10 --frozen --extra dev

      - name: "Assert Python 3.10 is active"
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"

      # opsmill_prefect_extras is vendored first-party code shipped with the package,
      # so it is present on disk in every install; the base-package guarantee that
      # nothing imports it without the service extra is enforced by
      # tests/test_no_prefect_import.py.
      - name: "Assert service runtime dependencies are absent from this environment"
        run: |
          for module in boto3 botocore fastapi prefect psycopg; do
            if uv run --no-sync python -c "import ${module}" 2>/dev/null; then
              echo "${module} is importable — this leg must be a base install"
              exit 1
            fi
          done
          if uv run --no-sync python -c "import uvicorn" 2>/dev/null; then
            echo "uvicorn is importable — this leg must be a base install"
            exit 1
          fi

      - name: "pytest: unit tests"
        run: uv run --no-sync invoke tests.tests-unit
