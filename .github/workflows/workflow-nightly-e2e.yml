---
# yamllint disable rule:truthy
name: "Run nightly end-to-end suites on a merged commit"
run-name: "Nightly E2E ${{ inputs.sha }}"

# An external scheduler dispatches this workflow against feature/v3-develop.
# GitHub schedules run only from the default branch, which is not the v3 line.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The full 40-character commit merged into feature/v3-develop"
        required: true
        type: string
      # Spec 021 FR-019, FR-020: the Compose suite runs once per architecture by default.
      # A repeat count above 1 runs it that many times on each, every run its own job on a
      # fresh runner, to measure how often it fails at random.
      compose_repeat:
        description: "How many times to run the Compose deployment suite on each architecture"
        required: false
        default: "1"
        type: string
      compose_architectures:
        description: "Which architectures run the Compose deployment suite"
        required: false
        default: both
        type: choice
        options:
          - both
          - amd64
          - arm64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-nightly-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  end-to-end:
    name: "Integration, smoke, saved plan, and local NetBox example"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: "Check out the requested commit"
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Test exactly the requested commit, and only one already merged into feature/v3-develop.
      - name: "Refuse an abbreviated, different, or unmerged commit"
        id: sha_guard
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          expected=${NIGHTLY_SHA:?the commit to test is required}
          case $expected in
            *[!0-9a-f]*)
              echo "the requested commit $expected is not a hexadecimal object name" >&2
              exit 1
              ;;
          esac
          if [ ${#expected} -ne 40 ]; then
            echo "the requested commit $expected is abbreviated; name the full 40-character commit" >&2
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "the checkout landed on $actual, not the $expected it was told to test" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin feature/v3-develop
          if ! git merge-base --is-ancestor "$expected" FETCH_HEAD; then
            echo "$expected is not merged into feature/v3-develop" >&2
            exit 1
          fi

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: "Install test dependencies"
        id: dependencies
        run: uv sync --frozen --extra dev --extra prefect --extra service

      - name: "Check every Compose image digest"
        id: images
        run: uv run --no-sync python .github/scripts/nightly_e2e.py verify-images

      - name: "Run the integration suite"
        id: integration
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite integration

      - name: "Save integration container logs on failure"
        if: always() && steps.integration.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs integration

      - name: "Run the development stack smoke suite"
        id: smoke
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite smoke

      - name: "Save smoke container logs on failure"
        if: always() && steps.smoke.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs smoke

      - name: "Run the saved-plan live suite with the seed dataset"
        id: saved-plan
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite saved-plan

      - name: "Save saved-plan container logs on failure"
        if: always() && steps.saved-plan.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs saved-plan

      - name: "Run the from-netbox example with the demo dataset"
        id: from-netbox
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite from-netbox

      - name: "Save from-netbox container logs on failure"
        if: always() && steps.from-netbox.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs from-netbox

      - name: "Summarize each suite"
        if: always() && steps.checkout.outcome == 'success'
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
          NIGHTLY_SHA_GUARD: ${{ steps.sha_guard.outcome }}
        run: python3 .github/scripts/nightly_e2e.py summary "$NIGHTLY_SHA"

      - name: "Upload per-suite JUnit reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-junit
          path: .dev/nightly-e2e/*.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: "Upload logs from failed suites"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-failed-container-logs
          path: .dev/nightly-e2e/*-containers.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: "Stop the development stack and remove volumes"
        if: always()
        run: |
          uv run --no-sync invoke dev.destroy || \
            docker compose -f development/docker-compose.yml \
              --profile sync --profile infrahub down --volumes --remove-orphans

      - name: "Stop NetBox services and remove volumes"
        if: always()
        run: |
          uv run --no-sync invoke netbox.destroy || \
            docker compose --env-file development/netbox/netbox.env \
              -f development/netbox/docker-compose.netbox.yml down --volumes

      - name: "Fail the run if a suite did not pass"
        if: always()
        env:
          SHA_GUARD: ${{ steps.sha_guard.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SAVED_PLAN: ${{ steps.saved-plan.outcome }}
          FROM_NETBOX: ${{ steps.from-netbox.outcome }}
        run: |
          for outcome in "$SHA_GUARD" "$DEPENDENCIES" "$IMAGES" "$INTEGRATION" \
            "$SMOKE" "$SAVED_PLAN" "$FROM_NETBOX"; do
            if [ "$outcome" != success ]; then
              echo "At least one end-to-end suite or prerequisite did not pass" >&2
              exit 1
            fi
          done

  # The run matrix of the Compose suite: one entry per architecture and repeat.
  compose-matrix:
    name: "Plan the Compose suite runs"
    runs-on: ubuntu-22.04
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: "Turn the inputs into a matrix"
        id: plan
        env:
          REPEAT: ${{ inputs.compose_repeat }}
          ARCHITECTURES: ${{ inputs.compose_architectures }}
        run: |
          set -eu
          case "${REPEAT}" in
            ''|*[!0-9]*) echo "compose_repeat must be a whole number, not ${REPEAT}" >&2; exit 1 ;;
          esac
          if [ "${REPEAT}" -lt 1 ] || [ "${REPEAT}" -gt 20 ]; then
            echo "compose_repeat must be between 1 and 20" >&2
            exit 1
          fi
          case "${ARCHITECTURES}" in
            amd64) runners='["ubuntu-22.04"]' ;;
            arm64) runners='["ubuntu-24.04-arm"]' ;;
            both) runners='["ubuntu-22.04", "ubuntu-24.04-arm"]' ;;
            *) echo "unknown architectures ${ARCHITECTURES}" >&2; exit 1 ;;
          esac
          runs=$(seq 1 "${REPEAT}" | paste -sd, -)
          echo "runners=${runners}" >> "${GITHUB_OUTPUT}"
          echo "runs=[${runs}]" >> "${GITHUB_OUTPUT}"

  compose-suite:
    name: "Compose deployment suite against a locally built image (${{ matrix.runner }}, run ${{ matrix.run }})"
    needs: compose-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.compose-matrix.outputs.runners) }}
        run: ${{ fromJSON(needs.compose-matrix.outputs.runs) }}
    steps:
      - name: "Check out the requested commit"
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The same exact-checkout and merged-ancestor guard as the job above.
      - name: "Refuse an abbreviated, different, or unmerged commit"
        id: sha_guard
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          expected=${NIGHTLY_SHA:?the commit to test is required}
          case $expected in
            *[!0-9a-f]*)
              echo "the requested commit $expected is not a hexadecimal object name" >&2
              exit 1
              ;;
          esac
          if [ ${#expected} -ne 40 ]; then
            echo "the requested commit $expected is abbreviated; name the full 40-character commit" >&2
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "the checkout landed on $actual, not the $expected it was told to test" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin feature/v3-develop
          if ! git merge-base --is-ancestor "$expected" FETCH_HEAD; then
            echo "$expected is not merged into feature/v3-develop" >&2
            exit 1
          fi

      - name: "Install uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: latest
          python-version: "3.13"

      # The `testcontainers` extra is what tests/compose/test_testcontainers_fixture.py
      # runs on: it starts Infrahub through infrahub-testcontainers and Sync through
      # `infrahub_sync.testcontainers`.
      - name: "Install test dependencies"
        run: uv sync --frozen --extra dev --extra prefect --extra service --extra testcontainers

      # The suite runs the root docker-compose.yml against the image this commit
      # builds, named the way an operator names a tag: INFRAHUB_SYNC_DOCKER_IMAGE
      # and VERSION. It is never pulled: the engine already holds it. The
      # `TestInfrahubSyncDocker` classes read the same two variables.
      - name: "Build the image under test"
        run: docker build -t infrahub-sync:compose-test .

      - name: "Run the Compose deployment suite"
        env:
          INFRAHUB_SYNC_DOCKER_IMAGE: infrahub-sync
          VERSION: compose-test
        run: uv run --no-sync pytest -m compose tests/compose --compose-zero-skip

      - name: "Upload the diagnostics of a failed Compose case"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-compose-diagnostics-${{ matrix.runner }}-${{ matrix.run }}
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
