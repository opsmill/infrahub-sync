---
# yamllint disable rule:truthy
name: "Run nightly end-to-end suites on a merged commit"
run-name: "Nightly E2E ${{ inputs.sha }}"

# An external scheduler dispatches this workflow against feature/v3-develop.
# GitHub schedules run only from the default branch, which is not the v3 line.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The full 40-character commit merged into feature/v3-develop"
        required: true
        type: string
      compose_repeat:
        description: "How many times each architecture runs the Compose deployment suite, from 1 to 10"
        required: false
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-nightly-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  end-to-end:
    name: "Integration, preview, saved plan, and local NetBox example"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: "Check out the requested commit"
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Test exactly the requested commit, and only one already merged into feature/v3-develop.
      - name: "Refuse an abbreviated, different, or unmerged commit"
        id: sha_guard
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          expected=${NIGHTLY_SHA:?the commit to test is required}
          case $expected in
            *[!0-9a-f]*)
              echo "the requested commit $expected is not a hexadecimal object name" >&2
              exit 1
              ;;
          esac
          if [ ${#expected} -ne 40 ]; then
            echo "the requested commit $expected is abbreviated; name the full 40-character commit" >&2
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "the checkout landed on $actual, not the $expected it was told to test" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin feature/v3-develop
          if ! git merge-base --is-ancestor "$expected" FETCH_HEAD; then
            echo "$expected is not merged into feature/v3-develop" >&2
            exit 1
          fi

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: "Install test dependencies"
        id: dependencies
        run: uv sync --frozen --extra dev --extra prefect --extra service

      - name: "Check every Compose image digest"
        id: images
        run: uv run --no-sync python .github/scripts/nightly_e2e.py verify-images

      - name: "Run the integration suite"
        id: integration
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite integration

      - name: "Save integration container logs on failure"
        if: always() && steps.integration.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs integration

      - name: "Run the preview smoke suite"
        id: preview
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite preview

      - name: "Save preview container logs on failure"
        if: always() && steps.preview.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs preview

      - name: "Run the saved-plan live suite with the seed dataset"
        id: saved-plan
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite saved-plan

      - name: "Save saved-plan container logs on failure"
        if: always() && steps.saved-plan.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs saved-plan

      - name: "Run the from-netbox example with the demo dataset"
        id: from-netbox
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: uv run --no-sync python .github/scripts/nightly_e2e.py suite from-netbox

      - name: "Save from-netbox container logs on failure"
        if: always() && steps.from-netbox.outcome == 'failure'
        continue-on-error: true
        run: python3 .github/scripts/nightly_e2e.py logs from-netbox

      - name: "Summarize each suite"
        if: always() && steps.checkout.outcome == 'success'
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
          NIGHTLY_SHA_GUARD: ${{ steps.sha_guard.outcome }}
        run: python3 .github/scripts/nightly_e2e.py summary "$NIGHTLY_SHA"

      - name: "Upload per-suite JUnit reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-junit
          path: .preview/nightly-e2e/*.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: "Upload logs from failed suites"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-failed-container-logs
          path: .preview/nightly-e2e/*-containers.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: "Stop preview services and remove volumes"
        if: always()
        run: |
          uv run --no-sync invoke preview.down --volumes || \
            docker compose --env-file development/preview.env \
              -f development/docker-compose.infrahub.yml \
              -f development/docker-compose.preview.yml down --volumes

      - name: "Stop NetBox services and remove volumes"
        if: always()
        run: |
          uv run --no-sync invoke netbox.down || \
            docker compose --env-file development/netbox/netbox.env \
              -f development/netbox/docker-compose.netbox.yml down --volumes

      - name: "Fail the run if a suite did not pass"
        if: always()
        env:
          SHA_GUARD: ${{ steps.sha_guard.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          PREVIEW: ${{ steps.preview.outcome }}
          SAVED_PLAN: ${{ steps.saved-plan.outcome }}
          FROM_NETBOX: ${{ steps.from-netbox.outcome }}
        run: |
          for outcome in "$SHA_GUARD" "$DEPENDENCIES" "$IMAGES" "$INTEGRATION" \
            "$PREVIEW" "$SAVED_PLAN" "$FROM_NETBOX"; do
            if [ "$outcome" != success ]; then
              echo "At least one end-to-end suite or prerequisite did not pass" >&2
              exit 1
            fi
          done

  compose-suite:
    name: "Compose deployment suite against a locally built image (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    # Repeated runs measure how often the suite fails; one run keeps the nightly bound.
    timeout-minutes: ${{ inputs.compose_repeat > 1 && 360 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: "Check out the requested commit"
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The same exact-checkout and merged-ancestor guard as the job above.
      - name: "Refuse an abbreviated, different, or unmerged commit"
        id: sha_guard
        env:
          NIGHTLY_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          expected=${NIGHTLY_SHA:?the commit to test is required}
          case $expected in
            *[!0-9a-f]*)
              echo "the requested commit $expected is not a hexadecimal object name" >&2
              exit 1
              ;;
          esac
          if [ ${#expected} -ne 40 ]; then
            echo "the requested commit $expected is abbreviated; name the full 40-character commit" >&2
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "the checkout landed on $actual, not the $expected it was told to test" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin feature/v3-develop
          if ! git merge-base --is-ancestor "$expected" FETCH_HEAD; then
            echo "$expected is not merged into feature/v3-develop" >&2
            exit 1
          fi

      - name: "Install uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: latest
          python-version: "3.13"

      - name: "Install test dependencies"
        run: uv sync --frozen --extra dev --extra prefect --extra service

      # The suite runs the root docker-compose.yml against the image this commit
      # builds, named the way an operator names a tag: INFRAHUB_SYNC_DOCKER_IMAGE
      # and VERSION. It is never pulled: the engine already holds it.
      # Each iteration takes several minutes on a shared runner, so the count is
      # capped at 10, the number SC-010 asks for.
      - name: "Check the compose_repeat input"
        id: compose_repeat_guard
        env:
          COMPOSE_REPEAT: ${{ inputs.compose_repeat }}
        run: |
          set -euo pipefail
          case $COMPOSE_REPEAT in
            ''|*[!0-9]*|0)
              echo "::error::compose_repeat must be a whole number between 1 and 10, not '$COMPOSE_REPEAT'"
              exit 1
              ;;
          esac
          if [ "$COMPOSE_REPEAT" -gt 10 ]; then
            echo "::error::compose_repeat must be a whole number between 1 and 10, not '$COMPOSE_REPEAT'"
            exit 1
          fi

      - name: "Build the image under test"
        run: docker build -t infrahub-sync:compose-test .

      # Every iteration runs the whole suite, even after an earlier one failed, so
      # a repeated dispatch counts failures instead of stopping at the first.
      # Each iteration keeps its pytest output and its .diagnostics/ directory
      # under .compose-iterations/compose-<arch>-<N>/.
      - name: "Run the Compose deployment suite"
        id: compose
        env:
          INFRAHUB_SYNC_DOCKER_IMAGE: infrahub-sync
          VERSION: compose-test
          COMPOSE_REPEAT: ${{ inputs.compose_repeat }}
          COMPOSE_ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          mkdir -p .compose-iterations
          failed=0
          for n in $(seq 1 "$COMPOSE_REPEAT"); do
            out=".compose-iterations/compose-$COMPOSE_ARCH-$n"
            rm -rf .diagnostics
            mkdir -p "$out"
            echo "::group::iteration $n"
            if uv run --no-sync pytest -m compose tests/compose --compose-zero-skip \
              --junitxml="$out/junit.xml" 2>&1 | tee "$out/pytest.log"; then
              result=pass
            else
              result=fail
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
            if [ -d .diagnostics ]; then
              mv .diagnostics "$out/diagnostics"
            fi
            echo "iteration $n: $result" | tee -a .compose-iterations/summary.txt
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: "Install the artifact client"
        if: always() && steps.compose.outcome != 'skipped'
        run: >-
          npm install --prefix "$RUNNER_TEMP/artifact-client" --no-save --ignore-scripts
          --no-audit --no-fund @actions/artifact@2.3.2

      # upload-artifact names one artifact per step, and the number of iterations
      # is an input, so the uploads go through the same client that action uses.
      - name: "Upload each iteration's diagnostics"
        if: always() && steps.compose.outcome != 'skipped'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { DefaultArtifactClient } = require(
              path.join(process.env.RUNNER_TEMP, 'artifact-client/node_modules/@actions/artifact'),
            );
            const client = new DefaultArtifactClient();
            const root = path.resolve('.compose-iterations');
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
            const iterations = fs.existsSync(root)
              ? fs.readdirSync(root, { withFileTypes: true }).filter((entry) => entry.isDirectory())
              : [];
            for (const iteration of iterations) {
              const dir = path.join(root, iteration.name);
              const files = walk(dir);
              if (files.length === 0) continue;
              await client.uploadArtifact(iteration.name, files, dir, { retentionDays: 7 });
              core.info(`uploaded ${iteration.name} (${files.length} files)`);
            }

      - name: "Fail the job if an iteration failed"
        if: always()
        env:
          COMPOSE: ${{ steps.compose.outcome }}
          FAILED: ${{ steps.compose.outputs.failed }}
          COMPOSE_REPEAT: ${{ inputs.compose_repeat }}
        run: |
          if [ -f .compose-iterations/summary.txt ]; then
            cat .compose-iterations/summary.txt
          fi
          if [ "$COMPOSE" != success ] || [ "${FAILED:-1}" != 0 ]; then
            echo "${FAILED:-unknown} of $COMPOSE_REPEAT Compose iterations failed" >&2
            exit 1
          fi
