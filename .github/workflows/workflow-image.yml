---
# yamllint disable rule:truthy
name: "Build the container image and qualify the Compose bundle"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

# `github.workflow` is the caller's name inside a reusable workflow, so a group
# built from it alone is shared with every sibling the same caller starts and
# they cancel each other. The literal below keeps this gate's own group, so a
# stale image run is still cancelled when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-image-${{ github.ref }}
  cancel-in-progress: true

# Read-only throughout. This gate builds and tests an image; it never logs in,
# tags for a registry, pushes, or promotes a digest.
permissions:
  contents: read
  packages: read

# Two different kinds of thing. A diagnostic is what a failed run leaves for
# whoever reads it that day. A handoff is not retention: an artifact is the only
# transfer GitHub offers between two jobs, so these bytes are downloaded once and
# deleted by `handoff-cleanup` inside this run. One day is the shortest window the
# service accepts and the fail-safe for a run that lost its cleanup; nothing may
# rely on it.
env:
  DIAGNOSTIC_RETENTION_DAYS: 7
  HANDOFF_RETENTION_DAYS: 1

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    outputs:
      image: ${{ steps.changes.outputs.image_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  image:
    name: "Image and Compose gate (build amd64 + arm64, qualify amd64)"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.image == 'true'
    runs-on: ${{ inputs.runs-on }}
    # One build, then everything qualified against it. The bound covers both
    # phases; the lifecycle phase carries its own, tighter one.
    timeout-minutes: 120
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v4"
        with:
          version: "latest"

      - name: "Install dependencies"
        run: uv sync --frozen --extra dev --extra prefect --extra service

      # arm64 is built and smoked under emulation on the amd64 runner. That is
      # build and smoke evidence; it is not a clean-host qualification claim.
      - name: "Set up QEMU for the non-native platform"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@v3

      # A throwaway value, generated per run and never stored, so the canary
      # checks measure this build rather than a constant somebody could special-case.
      - name: "Seed the build environment canary"
        run: echo "INFRAHUB_SYNC_IMAGE_CANARY=canary-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # The one step that reads package metadata. Every artifact name a later
      # phase uses is derived from what it records, so an approval can be checked
      # against the candidate rather than against whatever the source says then.
      - name: "Record the release identity every artifact is named from"
        run: uv run --no-sync invoke release.identity

      - name: "Build the distributions an approval would publish"
        run: uv run --no-sync invoke release.build

      - name: "Produce the deployment bundle and the qualification kit"
        run: uv run --no-sync invoke release.kit

      - name: "Build both platforms"
        run: uv run --no-sync invoke image.build

      - name: "Record the index and platform digests"
        run: uv run --no-sync invoke image.inspect

      # Two further builds on the builder the candidate build just warmed. They
      # prove a Python-only edit reaches the next image rather than resolving to
      # a cached wheel of the source before it.
      - name: "Prove the warm builder installs the source it copied"
        timeout-minutes: 45
        run: uv run --no-sync invoke image.freshness

      - name: "Generate the SPDX SBOM"
        run: uv run --no-sync invoke image.sbom

      - name: "Enforce the vulnerability policy"
        run: uv run --no-sync invoke image.scan

      - name: "Smoke both platforms"
        run: uv run --no-sync invoke image.smoke

      # Flattened, because a flat directory is what the driver reads out of
      # `CLEAN_HOST_CANDIDATE`: the qualified platform's image, the bundle, and
      # the checksum it verifies the bundle against before extracting it.
      - name: "Stage the exact bytes a clean host consumes"
        run: |
          set -euo pipefail
          mkdir -p .release/handoff
          cp .image/archives/image-linux-amd64.tar .release/handoff/
          cp .release/bundle/* .release/handoff/

      # Before the reclaim below, which is what removes the file being staged.
      # arm64's copy is gate input and stays behind.
      - name: "Hand the candidate bytes to the clean-host gate"
        id: candidate-handoff
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-handoff
          path: .release/handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.HANDOFF_RETENTION_DAYS }}

      # The largest thing the build leaves behind, and nothing reads it after the
      # scan, the smoke and the handoff above.
      - name: "Reclaim the exported archives"
        run: uv run --no-sync invoke compose.reclaim

      # The same job, the same layout, the same loaded amd64 image. The bundle is
      # handed that image's recorded configuration digest, so the lifecycle
      # evidence and the image evidence cannot describe separate builds.
      - name: "Qualify the Compose lifecycle on linux/amd64"
        timeout-minutes: 45
        run: uv run --no-sync invoke compose.lifecycle

      # Evidence, not bundle: what the gate needs and an operator never sees.
      - name: "Hand the qualification kit to the clean-host gate"
        id: qualification-kit
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-qualification-kit
          path: .release/qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.HANDOFF_RETENTION_DAYS }}

      # What `release.qualify` reads to name what the service is holding. After
      # the two uploads, because it names what they returned; the window is the
      # fail-safe floor and not a period an approval may be taken against.
      - name: "Record what the service is holding"
        run: |
          set -euo pipefail
          cat > .release/artifacts.json <<JSON
          {
            "retention_days": ${{ env.HANDOFF_RETENTION_DAYS }},
            "artifacts": {
              "infrahub-sync-candidate-handoff": {
                "id": "${{ steps.candidate-handoff.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-handoff.outputs.artifact-digest }}"
              },
              "infrahub-sync-qualification-kit": {
                "id": "${{ steps.qualification-kit.outputs.artifact-id }}",
                "digest": "${{ steps.qualification-kit.outputs.artifact-digest }}"
              }
            }
          }
          JSON

      # What the driver reads its expectations out of: this candidate's tag and
      # version, its bundle, and the configuration digest it has to find loaded.
      - name: "Write the qualification record"
        run: uv run --no-sync invoke release.qualify

      - name: "Hand the qualification record to the clean-host gate"
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-qualification-record
          path: .release/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.HANDOFF_RETENTION_DAYS }}

      # Only when the job has already failed, and only what the suite's own
      # capture boundary produced. A run that passes uploads nothing new.
      - name: "Publish what a failed lifecycle run saw"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-lifecycle-diagnostic
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ env.DIAGNOSTIC_RETENTION_DAYS }}

  # A host that has never seen this repository: no checkout, no interpreter, and
  # nothing but what the job above handed it. Every download is of this run's own
  # artifacts, because naming another run's would qualify a candidate some other
  # commit built and report the result against this head.
  clean-host:
    name: "Clean-host qualification (linux/amd64, no checkout)"
    needs: ["image"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 90
    steps:
      - name: "Download the candidate bytes this run produced"
        uses: actions/download-artifact@v4
        with:
          name: infrahub-sync-candidate-handoff
          path: candidate

      - name: "Download the record this run wrote for them"
        uses: actions/download-artifact@v4
        with:
          name: infrahub-sync-qualification-record
          path: candidate

      - name: "Download the qualification kit"
        uses: actions/download-artifact@v4
        with:
          name: infrahub-sync-qualification-kit
          path: kit

      # Inside the job's bound, so the phase reports which row was running rather
      # than being cut off by the runner. An artifact carries no mode, so the one
      # thing restored here is the bit the upload dropped.
      - name: "Run the mandatory matrix"
        timeout-minutes: 75
        env:
          CLEAN_HOST_CANDIDATE: ${{ github.workspace }}/candidate
        run: |
          set -eu
          chmod 0755 kit/clean-host.sh
          kit/clean-host.sh

      # The one file the driver swept and chose to keep, named exactly: the
      # working directory beside it holds the list of this run's own credentials.
      # A withheld diagnostic is an absent file, and the log says why.
      - name: "Publish the pre-teardown diagnostic of a failed row"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-clean-host-diagnostic
          path: kit/work/diagnostic.txt
          if-no-files-found: ignore
          retention-days: ${{ env.DIAGNOSTIC_RETENTION_DAYS }}

  # Where the handoff stops existing. It runs whatever the two jobs above
  # concluded, because a failed row, a skipped gate and a cancelled run leave the
  # same bytes behind as a passing one.
  handoff-cleanup:
    name: "Delete this run's handoff and prove the run holds none of it"
    needs: ["image", "clean-host"]
    if: always()
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    # Scoped here: at the workflow level every step of the build, of the gate and
    # of their third-party actions would carry a token that can delete this
    # repository's artifacts, runs and caches.
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      # The exact names, and only this run's own artifacts. Never a pattern: a
      # glob deletes whatever else matches and stops matching a renamed artifact.
      - name: "Delete the handoff artifacts this run created"
        run: |
          set -euo pipefail
          for name in \
            infrahub-sync-candidate-handoff \
            infrahub-sync-qualification-kit \
            infrahub-sync-qualification-record
          do
            for id in $(gh api --paginate \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${name}\") | .id")
            do
              gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${id}"
              echo "deleted ${name} (${id})"
            done
          done

      # Having issued the deletions is not the claim; holding nothing is. A
      # non-2xx delete, an upload nobody added above, and a partial upload a
      # cancelled job left behind all end with bytes still held.
      - name: "Refuse a run that still holds a candidate or a kit"
        run: |
          set -euo pipefail
          held=$(gh api --paginate \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[]
                  | select(.expired == false)
                  | select((.name | startswith("infrahub-sync-candidate"))
                        or (.name | startswith("infrahub-sync-qualification")))
                  | .name')
          if [ -n "${held}" ]; then
            echo "this run still holds $(echo "${held}" | tr "\n" " ")" >&2
            exit 1
          fi
          echo "this run holds no candidate, kit or qualification record"
