---
# yamllint disable rule:truthy
name: "Build the container image and qualify the Compose bundle"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

# `github.workflow` is the caller's name inside a reusable workflow, so a group
# built from it alone is shared with every sibling the same caller starts and
# they cancel each other. The literal below keeps this gate's own group, so a
# stale image run is still cancelled when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-image-${{ github.ref }}
  cancel-in-progress: true

# Read-only throughout. This gate builds and tests an image; it never logs in,
# tags for a registry, pushes, or promotes a digest.
permissions:
  contents: read
  packages: read

# How long the service holds a candidate's artifacts. An approval is bound to
# exactly these bytes, so the window has to outlast the decision to take them.
env:
  CANDIDATE_RETENTION_DAYS: 90

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    outputs:
      image: ${{ steps.changes.outputs.image_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  image:
    name: "Image and Compose gate (build amd64 + arm64, qualify amd64)"
    needs: ["files-changed"]
    if: needs.files-changed.outputs.image == 'true'
    runs-on: ${{ inputs.runs-on }}
    # One build, then everything qualified against it. The bound covers both
    # phases; the lifecycle phase carries its own, tighter one.
    timeout-minutes: 120
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v4"
        with:
          version: "latest"

      - name: "Install dependencies"
        run: uv sync --frozen --extra dev --extra prefect --extra service

      # arm64 is built and smoked under emulation on the amd64 runner. That is
      # build and smoke evidence; it is not a clean-host qualification claim.
      - name: "Set up QEMU for the non-native platform"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@v3

      # A throwaway value, generated per run and never stored, so the canary
      # checks measure this build rather than a constant somebody could special-case.
      - name: "Seed the build environment canary"
        run: echo "INFRAHUB_SYNC_IMAGE_CANARY=canary-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # The one step that reads package metadata. Every artifact name a later
      # phase uses is derived from what it records, so an approval can be checked
      # against the candidate rather than against whatever the source says then.
      - name: "Record the release identity every artifact is named from"
        run: uv run --no-sync invoke release.identity

      - name: "Build the distributions an approval would publish"
        run: uv run --no-sync invoke release.build

      - name: "Produce the deployment bundle and the qualification kit"
        run: uv run --no-sync invoke release.kit

      - name: "Build both platforms"
        run: uv run --no-sync invoke image.build

      - name: "Record the index and platform digests"
        run: uv run --no-sync invoke image.inspect

      # Two further builds on the builder the candidate build just warmed. They
      # prove a Python-only edit reaches the next image rather than resolving to
      # a cached wheel of the source before it.
      - name: "Prove the warm builder installs the source it copied"
        timeout-minutes: 45
        run: uv run --no-sync invoke image.freshness

      - name: "Generate the SPDX SBOM"
        run: uv run --no-sync invoke image.sbom

      - name: "Enforce the vulnerability policy"
        run: uv run --no-sync invoke image.scan

      - name: "Smoke both platforms"
        run: uv run --no-sync invoke image.smoke

      # The qualified architecture, taken before the archives are reclaimed. A
      # clean host loads this exact file, so it is the one that has to survive
      # the run; arm64's copy is gate input and stays behind.
      - name: "Publish the qualified platform image as a candidate artifact"
        id: candidate-image
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-image
          path: .image/archives/image-linux-amd64.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      # Each archive is one platform image copied out of the retained layout, and
      # those copies are the largest thing the build leaves behind. Nothing reads
      # them after the scan, the smoke, and the upload above; the layout they came
      # from stays, and the lifecycle phase starts two container stacks.
      - name: "Reclaim the exported archives"
        run: uv run --no-sync invoke compose.reclaim

      # The same job, the same layout, the same loaded amd64 image. The bundle is
      # handed that image's recorded configuration digest, so the lifecycle
      # evidence and the image evidence cannot describe separate builds.
      - name: "Qualify the Compose lifecycle on linux/amd64"
        timeout-minutes: 45
        run: uv run --no-sync invoke compose.lifecycle

      - name: "Publish the recorded identity as a candidate artifact"
        id: candidate-identity
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-identity
          path: .release/identity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      - name: "Publish the built distributions as a candidate artifact"
        id: candidate-distributions
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-distributions
          path: |
            .release/dist/*.whl
            .release/dist/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      - name: "Publish the deployment bundle and its checksum"
        id: candidate-bundle
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-bundle
          path: .release/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      - name: "Publish the bills of materials and the vulnerability reports"
        id: candidate-sboms
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-candidate-sboms
          path: |
            .image/digests.json
            .image/*-sbom-*.spdx.json
            .image/*-vulnerabilities-*.json
          # The build writes its evidence under a hidden directory, which the
          # upload skips by default and then reports as no files found.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      # Evidence, not bundle: what the clean-host gate needs and an operator
      # never sees.
      - name: "Publish the clean-host qualification kit"
        id: qualification-kit
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-qualification-kit
          path: .release/qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      # What the service is holding and for how long. The record below is bound
      # to these identifiers, so it is written after the uploads that produce
      # them and published last.
      - name: "Record what the service is holding"
        run: |
          set -euo pipefail
          cat > .release/artifacts.json <<JSON
          {
            "retention_days": ${{ env.CANDIDATE_RETENTION_DAYS }},
            "artifacts": {
              "infrahub-sync-candidate-identity": {
                "id": "${{ steps.candidate-identity.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-identity.outputs.artifact-digest }}"
              },
              "infrahub-sync-candidate-distributions": {
                "id": "${{ steps.candidate-distributions.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-distributions.outputs.artifact-digest }}"
              },
              "infrahub-sync-candidate-bundle": {
                "id": "${{ steps.candidate-bundle.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-bundle.outputs.artifact-digest }}"
              },
              "infrahub-sync-candidate-image": {
                "id": "${{ steps.candidate-image.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-image.outputs.artifact-digest }}"
              },
              "infrahub-sync-candidate-sboms": {
                "id": "${{ steps.candidate-sboms.outputs.artifact-id }}",
                "digest": "${{ steps.candidate-sboms.outputs.artifact-digest }}"
              },
              "infrahub-sync-qualification-kit": {
                "id": "${{ steps.qualification-kit.outputs.artifact-id }}",
                "digest": "${{ steps.qualification-kit.outputs.artifact-digest }}"
              }
            }
          }
          JSON

      - name: "Write the qualification record"
        run: uv run --no-sync invoke release.qualify

      # Only when the job has already failed, and only what the suite's own
      # capture boundary produced. A run that passes uploads nothing new.
      - name: "Publish what a failed lifecycle run saw"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-lifecycle-diagnostic
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

      - name: "Publish the qualification record"
        uses: actions/upload-artifact@v4
        with:
          name: infrahub-sync-qualification-record
          path: .release/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

  # A host that has never seen this repository. It checks nothing out, installs no
  # interpreter, and downloads the candidate the job above published: what it runs
  # is the released artifact, not the tree that produced it.
  clean-host:
    name: "Clean-host qualification (linux/amd64, no checkout)"
    needs: ["image"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 90
    steps:
      - name: "Download the candidate this run produced"
        uses: actions/download-artifact@v4
        with:
          pattern: infrahub-sync-{candidate,qualification}-*
          merge-multiple: true
          path: candidate

      - name: "Download the qualification kit"
        uses: actions/download-artifact@v4
        with:
          name: infrahub-sync-qualification-kit
          path: kit

      # Inside the job's bound, so the phase reports a result rather than being
      # cut off by the runner with nothing said about which row was running.
      - name: "Run the mandatory matrix"
        timeout-minutes: 75
        env:
          CLEAN_HOST_CANDIDATE: ${{ github.workspace }}/candidate
        run: |
          set -eu
          chmod 0755 kit/clean-host.sh
          kit/clean-host.sh
