---
# yamllint disable rule:truthy
name: "Pull Request on develop"

on:
  workflow_dispatch:
  push:
    branches:
      - "renovate/**"
  pull_request:
    branches:
      - develop
      - feature/v3-develop

# A called workflow can only keep or reduce these, never raise them, so every
# permission any workflow below requests has to be granted at or above it. These
# are the defaults every call gets: read the source, read packages to pull the
# bases the image gate builds and scans from, and write nothing. The one call
# that needs more states it on itself.
permissions:
  contents: read
  packages: read

jobs:
  linter:
    uses: ./.github/workflows/workflow-linter.yml

  uv-checker:
    uses: ./.github/workflows/workflow-uv-check.yml

  tests:
    needs: ["linter", "uv-checker"]
    uses: ./.github/workflows/workflow-tests.yml

  image:
    needs: ["linter", "uv-checker"]
    # That gate deletes its own handoff artifacts inside the run that created
    # them, which is an `actions: write` this call has to grant. Granted here
    # rather than at the top of this file so no other call carries it, and the
    # gate narrows it again to the single job that deletes.
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/workflow-image.yml
