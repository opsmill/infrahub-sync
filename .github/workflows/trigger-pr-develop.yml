---
# yamllint disable rule:truthy
name: "Pull Request on develop"

on:
  workflow_dispatch:
  push:
    branches:
      - "renovate/**"
      # The merged tree, which no pull-request run ever built as itself: what a
      # pull request checks is its head merged with the base at that moment, and
      # the commit that lands can differ from it.
      - "feature/v3-develop"
  pull_request:
    branches:
      - develop
      - feature/v3-develop

# A called workflow can only keep or reduce these, never raise them. These are
# the defaults every call gets: read the source and packages, and write nothing.
# The one call that needs more states it on itself.
permissions:
  contents: read
  packages: read

jobs:
  # Whether this head changes an image input, and the version the image labels
  # carry. A `workflow_call` input cannot run a step, so the version is read here
  # and handed to the image call as an output.
  image-changes:
    name: "Detect image input changes"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    outputs:
      image_inputs: ${{ steps.changes.outputs.image_inputs }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: "Check whether the change touches an image input"
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

      - name: "Read the version from pyproject.toml"
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c '
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  linter:
    uses: ./.github/workflows/workflow-linter.yml

  uv-checker:
    uses: ./.github/workflows/workflow-uv-check.yml

  # Tests run alongside lint so lint is not on their critical path. The image
  # build below waits for lint to avoid spending build time on a failing head.
  # `qualification-required` still waits for every check before allowing a merge.
  tests:
    uses: ./.github/workflows/workflow-tests.yml

  # Builds and smoke-tests the image on amd64 and arm64, and pushes nothing. No
  # `secrets` are passed, so a fork's pull request runs exactly what an internal
  # branch runs.
  image:
    needs: ["image-changes", "linter"]
    if: needs.image-changes.outputs.image_inputs == 'true'
    # `id-token: write` is granted for one reason: GitHub checks every job of a
    # called workflow against what its caller grants, the skipped publish-only
    # ones included, and `sign` and `sbom` ask for it. With `publish: false`
    # those jobs never run, so no token is ever minted here.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-docker-image.yml
    with:
      publish: false
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      tags: infrahub-sync:pr
      # The smoke test refuses a revision label naming any commit but the one
      # checked out from `ref`, so both read the same expression.
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.version=${{ needs.image-changes.outputs.version }}
        org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}

  # The one check branch protection requires by name. A skipped job satisfies a
  # required check, so this job always runs and judges the others: it waits for
  # the image, lint, unit-test, and lock-file calls and refuses a head where any
  # of them failed or was cancelled.
  qualification-required:
    name: "Full qualification"
    needs: ["image-changes", "image", "linter", "tests", "uv-checker"]
    # Not `success()`: the whole point is to report on a call that was skipped.
    if: ${{ always() }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    steps:
      - name: "Refuse a head whose checks did not pass"
        env:
          CHANGES: ${{ needs.image-changes.result }}
          IMAGE: ${{ needs.image.result }}
          LINTER: ${{ needs.linter.result }}
          TESTS: ${{ needs.tests.result }}
          UV_CHECKER: ${{ needs.uv-checker.result }}
        run: |
          set -euo pipefail
          # The backticks are job names in prose, single-quoted so the shell
          # leaves them alone.
          # shellcheck disable=SC2016
          if [ "${CHANGES}" != "success" ]; then
            printf '`image-changes` ended in %s, so nothing knows whether an image input changed\n' "${CHANGES}" >&2
            exit 1
          fi
          # `skipped` is the honest pass: the filter found no image input, so
          # there was nothing to build. A failure or a cancellation is not one.
          # shellcheck disable=SC2016
          if [ "${IMAGE}" != "success" ] && [ "${IMAGE}" != "skipped" ]; then
            printf '`image` ended in %s\n' "${IMAGE}" >&2
            exit 1
          fi
          for check in "linter:${LINTER}" "tests:${TESTS}" "uv-checker:${UV_CHECKER}"; do
            if [ "${check#*:}" != "success" ] && [ "${check#*:}" != "skipped" ]; then
              echo "the ${check%%:*} check ended in ${check#*:}" >&2
              exit 1
            fi
          done
          echo "every check covered this head (image: ${IMAGE})"
