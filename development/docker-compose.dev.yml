---
# Run from source: the whole Sync service, built from this checkout.
#
#     uv run invoke start
#     # or: docker compose -f development/docker-compose.dev.yml up --detach --wait
#
# The operator deployment is the other way to run V3: the root
# docker-compose.yml pulls the released image from the OpsMill registry and
# takes its credentials from the operator's environment. Nothing here is
# pinned or released, every credential below is a constant in a tracked file,
# and the image is whatever your working tree builds for your own architecture.
#
# Compose auto-loads a `.env` from the project directory, which is this
# `development/` directory. The repository ignores `*.env`, so a stray
# `development/.env` would feed this stack silently.
#
# Destination: none. A deployment starts with an empty configuration registry
# and reaches nothing until a package is registered. To sync against a local
# Infrahub, run `uv run invoke preview.up` and start this stack with
# INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN set; sync-worker already carries the
# host route. A package's `env` credential identifiers must start with
# INFRAHUB_SYNC_CREDENTIAL_, and these three are the ones this stack passes.
#
# Infrahub's task manager: this stack runs its own, from the same pinned Infrahub
# image the preview uses, with its own PostgreSQL server. Sync allows one
# deployment per task manager (the service's Prefect deployment name is fixed),
# so the dev stack never shares the preview's.
#
# Source: the local NetBox (`uv run invoke netbox.up` or `netbox.seed`) publishes
# on the host's loopback address only, which no container can reach. The Invoke
# tasks connect sync-worker to NetBox's own network instead, where it reads
# NetBox at http://netbox:8080. `docker compose up` alone does not reconnect a
# recreated worker; `uv run invoke start` does.

name: infrahub-sync-dev

x-sync-build: &sync-build
  context: ..
  dockerfile: Dockerfile

x-sync-image: &sync-image "infrahub-sync:dev"

x-sync-env: &sync-env
  INFRAHUB_SYNC_DATABASE_URL: "postgresql://postgres:devpassword@task-manager-db:5432/infrahub_sync"
  INFRAHUB_SYNC_S3_BUCKET: "infrahub-sync"
  INFRAHUB_SYNC_S3_PREFIX: "infrahub-sync"
  INFRAHUB_SYNC_S3_ENDPOINT_URL: "http://object-store:9000"
  INFRAHUB_SYNC_S3_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "devaccesskey"
  AWS_SECRET_ACCESS_KEY: "devsecretkey"
  INFRAHUB_SYNC_SERVICE_WORK_POOL: "infrahub-sync"
  PREFECT_API_URL: "http://task-manager:4200/api"

services:
  # Infrahub's task manager, as Infrahub's own Compose file runs it: Infrahub's
  # Prefect server app from the pinned Infrahub image, on its own PostgreSQL.
  task-manager-db:
    image: "postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"  # yamllint disable-line rule:line-length
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "devpassword"
      POSTGRES_DB: "prefect"
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - "task-manager-db-data:/var/lib/postgresql/18/docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d prefect -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  object-store:
    # The same temporary Chainguard build the root `docker-compose.yml` and the
    # preview stack pin: the quay.io MinIO image no longer allows anonymous pulls
    # (since 2026-09-24).
    image: "cgr.dev/chainguard/minio:latest-dev@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba"  # yamllint disable-line rule:line-length
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "devaccesskey"
      MINIO_ROOT_PASSWORD: "devsecretkey"
      MINIO_BROWSER: "off"
    volumes:
      - "object-store-data:/data"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://localhost:9000/minio/health/live"]  # yamllint disable-line rule:line-length
      interval: 5s
      timeout: 5s
      retries: 30

  task-manager:
    image: "registry.opsmill.io/opsmill/infrahub:1.11.4@sha256:68e9697b9209305538e6fc4ecefc8f36a0e5a3f17e0b8eb8f35235416cc3aecf"  # yamllint disable-line rule:line-length
    command: ["uvicorn", "--host", "0.0.0.0", "--port", "4200", "--factory", "infrahub.prefect_server.app:create_infrahub_prefect"]  # yamllint disable-line rule:line-length
    depends_on:
      task-manager-db:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://postgres:devpassword@task-manager-db:5432/prefect"
      PREFECT_UI_API_URL: "http://127.0.0.1:4230/api"
    ports:
      - "127.0.0.1:4230:4200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:4200/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Sync's product database on the task manager's PostgreSQL server. Safe to
  # repeat; it never touches the task manager's own `prefect` database.
  db-bootstrap:
    image: "postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"  # yamllint disable-line rule:line-length
    restart: "no"
    depends_on:
      task-manager-db:
        condition: service_healthy
    environment:
      PGHOST: "task-manager-db"
      PGUSER: "postgres"
      PGPASSWORD: "devpassword"
      PGDATABASE: "postgres"
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        psql --quiet --tuples-only --no-align
        --command "SELECT 1 FROM pg_database WHERE datname = 'infrahub_sync'" | grep -qx 1
        || createdb infrahub_sync

  # Converges the product schema, the artifact bucket, the work pool, and the
  # installed deployment. Registers no configuration. Safe to repeat, which is
  # what makes a rebuild-and-restart a one-liner.
  sync-bootstrap:
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.bootstrap"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
      task-manager:
        condition: service_healthy
    environment:
      <<: *sync-env

  sync-api:
    image: *sync-image
    build: *sync-build
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      INFRAHUB_SYNC_SERVICE_HOST: "0.0.0.0"
      # Required: the API refuses to construct its principal resolver without
      # one, and rejects a token shorter than 16 characters.
      INFRAHUB_SYNC_SERVICE_BEARER_TOKENS: >-
        {"dev": {"token": "infrahub-sync-dev-token", "administrator": true}}
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "300"
      PREFECT_WORKER_QUERY_SECONDS: "10"
      INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8030:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx; httpx.get('http://127.0.0.1:8000/version', timeout=5).raise_for_status()"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  sync-worker:
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.worker", "--pool", "infrahub-sync"]
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "300"
      PREFECT_WORKER_QUERY_SECONDS: "10"
      PREFECT_WORKER_HEARTBEAT_SECONDS: "10"
      INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN:-}"
      INFRAHUB_SYNC_CREDENTIAL_NETBOX_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_NETBOX_TOKEN:-}"
      INFRAHUB_SYNC_CREDENTIAL_NAUTOBOT_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_NAUTOBOT_TOKEN:-}"
    # The only service that reaches a destination. The root `docker-compose.yml`
    # carries no host route on purpose; a dev stack whose destination is `preview.up` on
    # this laptop needs one, and it costs nothing when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  task-manager-db-data:
  object-store-data:
