---
# Preview overrides for the Infrahub compose file based on
# https://infrahub.opsmill.io/1.10.6. The destination file includes local image
# digest pins; do not replace it from upstream without restoring those pins.
#
# This file remaps host ports so the preview never collides with another local
# Infrahub stack, drops host port publications the preview does not need, and
# adds a dedicated Prefect server for Infrahub Sync's service execution path —
# separate from Infrahub's internal task-manager, and pinned to the same Prefect
# version as the `service` extra (prefect==3.8.1).
# Refresh pins with `docker buildx imagetools inspect name:tag`: use the top-level
# index Digest and check for linux/amd64 and linux/arm64 manifests. When changing
# PREVIEW_PREFECT_IMAGE_TAG in the preview, set PREVIEW_PREFECT_IMAGE_DIGEST to its matching
# @sha256 digest. An empty digest is for an intentionally unpinned local image.
services:
  sync-postgres:
    image: "postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"  # yamllint disable-line rule:line-length
    environment:
      POSTGRES_DB: infrahub_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PREVIEW_STORAGE_POSTGRES_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrahub_sync"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-minio:
    image: "quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e"  # yamllint disable-line rule:line-length
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${PREVIEW_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${PREVIEW_MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "${PREVIEW_MINIO_PORT:-9010}:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-minio-bootstrap:
    image: "quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3"  # yamllint disable-line rule:line-length
    depends_on:
      sync-minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set preview http://sync-minio:9000
      ${PREVIEW_MINIO_ACCESS_KEY:-minioadmin} ${PREVIEW_MINIO_SECRET_KEY:-minioadmin}
      && mc mb --ignore-existing preview/${PREVIEW_S3_BUCKET:-infrahub-sync-preview}"

  infrahub-server:
    ports: !override
      - "${PREVIEW_INFRAHUB_PORT:-8080}:8000"

  message-queue:
    ports: !reset []

  database:
    ports: !reset []

  sync-prefect:
    image: "prefecthq/prefect:${PREVIEW_PREFECT_IMAGE_TAG:-3.8.1-python3.12@sha256:2d647011130f4bb36ee07b8386921890f1da44a9b7fbf81cfa86a555b92f151e}${PREVIEW_PREFECT_IMAGE_DIGEST-}"  # yamllint disable-line rule:line-length
    command: prefect server start --host 0.0.0.0 --port 4200
    depends_on:
      sync-minio-bootstrap:
        condition: service_completed_successfully
    environment:
      PREFECT_SERVER_UI_API_URL: "http://localhost:${PREVIEW_PREFECT_PORT:-4210}/api"
    ports:
      - "${PREVIEW_PREFECT_PORT:-4210}:4200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
