---
# Preview overrides for the pinned official Infrahub compose file
# (docker-compose.infrahub.yml — downloaded pristine from
# https://infrahub.opsmill.io/1.10.6; do not edit that file, replace it from the
# source URL and update VERSION in preview.env).
#
# This file remaps host ports so the preview never collides with another local
# Infrahub stack, drops host port publications the preview does not need, and
# adds a dedicated Prefect server for Infrahub Sync's managed execution path —
# separate from Infrahub's internal task-manager, and pinned to the same Prefect
# version as the `managed` extra (prefect==3.8.1).
services:
  sync-postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_DB: infrahub_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PREVIEW_STORAGE_POSTGRES_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrahub_sync"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-minio:
    image: "minio/minio:RELEASE.2025-04-22T22-12-26Z"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${PREVIEW_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${PREVIEW_MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "${PREVIEW_MINIO_PORT:-9010}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-minio-bootstrap:
    image: "minio/mc:RELEASE.2025-04-16T18-13-26Z"
    depends_on:
      sync-minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set preview http://sync-minio:9000
      ${PREVIEW_MINIO_ACCESS_KEY:-minioadmin} ${PREVIEW_MINIO_SECRET_KEY:-minioadmin}
      && mc mb --ignore-existing preview/${PREVIEW_S3_BUCKET:-infrahub-sync-preview}"

  infrahub-server:
    ports: !override
      - "${PREVIEW_INFRAHUB_PORT:-8080}:8000"

  message-queue:
    ports: !reset []

  database:
    ports: !reset []

  sync-prefect:
    image: "prefecthq/prefect:${PREVIEW_PREFECT_IMAGE_TAG:-3.8.1-python3.12}"
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_SERVER_UI_API_URL: "http://localhost:${PREVIEW_PREFECT_PORT:-4210}/api"
    ports:
      - "${PREVIEW_PREFECT_PORT:-4210}:4200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
