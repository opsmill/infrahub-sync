---
# Run from source: the whole Sync service, built from this checkout, and, with a
# preset that adds it, a local Infrahub to sync into.
#
#     uv run invoke dev.start                     # preset `sync`: no Infrahub
#     uv run invoke dev.infrahub                  # preset `infrahub`: plus a local Infrahub
#     uv run invoke dev.preview                   # preset `preview`: plus the local NetBox and the smoke dataset
#     uv run invoke dev.demo                      # preset `demo`: plus the local NetBox, ready for the NetBox demo
#     # or: docker compose -f development/docker-compose.yml --profile sync --profile infrahub up --detach --wait
#
# The operator deployment is the other way to run V3: the root
# docker-compose.yml pulls the released image from the OpsMill registry and
# takes its credentials from the operator's environment. Nothing here is
# pinned or released, every credential below is a development default in a
# tracked file, and the image is whatever your working tree builds for your own
# architecture.
#
# Services, by profile:
#
# - No profile: `postgres`, `object-store-init`, `object-store` and
#   `prefect-server`. They always start.
# - `sync`: `sync-bootstrap`, `sync-api` and `sync-worker`. Leave it off to run
#   the Sync API and the worker as processes on the host instead
#   (`uv run invoke dev.deps`, then `dev.api` and `dev.worker`). They reach
#   PostgreSQL, the object store and the Prefect server on their loopback ports.
# - `infrahub`: the Infrahub services from `docker-compose.infrahub.yml`. The
#   `infrahub` and `preview` presets turn it on; the default `sync` preset leaves
#   it off to sync into an Infrahub that already runs elsewhere, by default one
#   on this host at http://host.docker.internal:8000.
#
# Every Sync-image service mounts `infrahub_sync/` and `opsmill_prefect_extras/`
# from this checkout, read-only, over the copies the image installed. A code
# change therefore needs a container restart, not an image rebuild. A change to
# `development/Dockerfile`, `pyproject.toml` or `uv.lock` needs a rebuild.
#
# Every setting below reads `${NAME:-default}`, so a shell variable of that name
# changes it and a clean checkout needs none. Compose also auto-loads a `.env`
# from the project directory, which is this `development/` directory. The
# repository ignores `*.env`, so a stray `development/.env` would feed this
# stack silently.
#
# Destination: with the `infrahub` profile the worker shares a network with
# Infrahub and reaches it at http://infrahub-server:8000; the host reaches it at
# http://127.0.0.1:${INFRAHUB_PORT:-8000}. To use an Infrahub started from Infrahub's own Compose
# file (https://infrahub.opsmill.io) with `docker compose -p infrahub` instead,
# leave the profile off: `uv run invoke dev.start --infrahub-network infrahub_default`
# connects sync-worker to that network.
#
# Credentials: no Sync service is given a source or destination credential. The
# Sync API stores them, encrypted with INFRAHUB_SYNC_ENCRYPTION_KEY, and the worker
# reads the values a run names from the Sync API with INFRAHUB_SYNC_WORKER_TOKEN.
# `uv run invoke dev.start` stores `infrahub-token` and `netbox-token` through the
# Sync API after the stack starts.
#
# Source: the local NetBox (`uv run invoke netbox.start` or `netbox.seed`) publishes
# on the host's loopback address only, which no container can reach. The Invoke
# tasks connect sync-worker to NetBox's own network instead, where it reads
# NetBox at http://netbox:8080. `docker compose up` alone does not reconnect a
# recreated worker to either network; `uv run invoke dev.start` does.

name: infrahub-sync-dev

# The Infrahub services come from `docker-compose.infrahub.yml`, under the
# `infrahub` profile, and `docker-compose.infrahub-ports.yml` changes only their
# host publications. Compose refuses a service that this file defines again
# after an include, so the changes are an override file of the include itself.
include:
  - path:
      - docker-compose.infrahub.yml
      - docker-compose.infrahub-ports.yml

x-sync-build: &sync-build
  context: ..
  dockerfile: development/Dockerfile

# SYNC_IMAGE names another tag, so two checkouts can build and run their own image.
x-sync-image: &sync-image "${SYNC_IMAGE:-infrahub-sync:dev}"

# The checkout's source, mounted over the installed distribution in the image's
# virtual environment.
x-sync-source: &sync-source
  - "../infrahub_sync:/opt/infrahub-sync/venv/lib/python3.13/site-packages/infrahub_sync:ro"
  - "../opsmill_prefect_extras:/opt/infrahub-sync/venv/lib/python3.13/site-packages/opsmill_prefect_extras:ro"
# The same source mounts, plus the operator's CA certificates, read-only, for the three
# services that make outgoing TLS connections. INFRAHUB_SYNC_CA_CERTIFICATES names a host
# directory of *.pem and *.crt files; unset, the mount is an empty named volume.
x-sync-source-and-ca: &sync-source-and-ca
  - "../infrahub_sync:/opt/infrahub-sync/venv/lib/python3.13/site-packages/infrahub_sync:ro"
  - "../opsmill_prefect_extras:/opt/infrahub-sync/venv/lib/python3.13/site-packages/opsmill_prefect_extras:ro"
  - "${INFRAHUB_SYNC_CA_CERTIFICATES:-sync-ca-certificates}:/etc/infrahub-sync/ca:ro"

x-sync-env: &sync-env
  INFRAHUB_SYNC_DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/infrahub_sync"
  INFRAHUB_SYNC_S3_BUCKET: "infrahub-sync"
  INFRAHUB_SYNC_S3_PREFIX: "infrahub-sync"
  # The bundled store by default. To use an S3-compatible store the team runs, set the
  # endpoint and the addressing style in `.env`, and leave the bundled store out with
  # INFRAHUB_SYNC_BUNDLED_OBJECT_STORE=0; sync-bootstrap refuses either setting without
  # the other.
  INFRAHUB_SYNC_S3_ENDPOINT_URL: "${INFRAHUB_SYNC_S3_ENDPOINT_URL:-http://object-store:9000}"
  INFRAHUB_SYNC_S3_ADDRESSING_STYLE: "${INFRAHUB_SYNC_S3_ADDRESSING_STYLE:-path}"
  # Where the CA mount lands; each process trusts the certificates in it next to the
  # public roots (infrahub_sync/service/trust_store.py).
  INFRAHUB_SYNC_CA_DIRECTORY: "/etc/infrahub-sync/ca"
  INFRAHUB_SYNC_S3_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY:-devaccesskey}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_SECRET_KEY:-devsecretkey}"
  INFRAHUB_SYNC_SERVICE_WORK_POOL: "${WORK_POOL:-infrahub-sync}"
  INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "${RUN_ADMISSION_TTL_SECONDS:-300}"
  INFRAHUB_SYNC_REQUIRE_APPROVAL: "${REQUIRE_APPROVAL-false}"
  INFRAHUB_SYNC_AUTOMATIC_RESUME: "${AUTOMATIC_RESUME-false}"
  PREFECT_WORKER_QUERY_SECONDS: "${PREFECT_WORKER_QUERY_SECONDS:-10}"
  PREFECT_API_URL: "http://prefect-server:4200/api"

x-silo-image: &silo-image >-
  pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7

services:
  postgres:
    image: "postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "devpassword"
      POSTGRES_DB: "postgres"
    ports:
      - "127.0.0.1:${STORAGE_POSTGRES_PORT:-5440}:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    # The two databases the stack needs, from the `init-databases` config below. The
    # entrypoint runs this only when it initializes the data directory, so a volume
    # that predates a new database in that file never gains it; the healthcheck turns
    # that into a failed start rather than a puzzling one downstream.
    configs:
      - source: init-databases
        target: /docker-entrypoint-initdb.d/10-databases.sql
    # Reads the catalog over TCP, rather than pinging. The entrypoint runs the init
    # file against a server that listens on the socket alone, so a socket ping reports
    # healthy while the databases may not exist and no dependent can connect yet.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql --host 127.0.0.1 --username "$$POSTGRES_USER"
          --dbname postgres --tuples-only --no-align
          --command "SELECT count(*) = 2 FROM pg_database WHERE datname IN ('infrahub_sync', 'prefect')"
          | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 30

  # Gives the object store's volume to the unprivileged user Silo runs as. A
  # volume created by an earlier root-run object store is owned by root, which
  # Silo cannot write to; a volume that is already right is left alone.
  object-store-init:
    # 0 leaves the bundled store out: Compose creates no container for it.
    scale: ${INFRAHUB_SYNC_BUNDLED_OBJECT_STORE:-1}
    image: *silo-image
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ "$$(stat -c %u:%g /data)" != "65532:65532" ]; then
          chown -R 65532:65532 /data;
        fi
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    volumes:
      - "object-store-data:/data"

  object-store:
    # Silo, a maintained build of the MinIO server, the same pinned release as the
    # root `docker-compose.yml`. Source: https://github.com/pgsty/silo, licensed
    # under the AGPLv3. It reads the MINIO_* settings below.
    # 0 leaves the bundled store out: Compose creates no container for it.
    scale: ${INFRAHUB_SYNC_BUNDLED_OBJECT_STORE:-1}
    image: *silo-image
    user: "65532:65532"
    command: ["server", "/data"]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-devaccesskey}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-devsecretkey}"
      MINIO_BROWSER: "off"
    # On loopback, for the Sync API and the worker when they run on the host
    # (`uv run invoke dev.deps`); the containers use http://object-store:9000.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9010}:9000"
    volumes:
      - "object-store-data:/data"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The Prefect server runs from the Sync image, so it serves the Prefect version
  # the Sync processes call. The UI is on, on loopback; Prefect writes the UI's
  # files to the static directory below at start.
  prefect-server:
    image: *sync-image
    build: *sync-build
    command:
      - "uvicorn"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4200"
      - "--factory"
      - "infrahub_sync.service.prefect_server:create_prefect_app"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://postgres:devpassword@postgres:5432/prefect"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: "4200"
      PREFECT_UI_ENABLED: "true"
      PREFECT_UI_STATIC_DIRECTORY: "/tmp/infrahub-sync/prefect-ui"
      PREFECT_SERVER_UI_API_URL: "http://127.0.0.1:${PREFECT_PORT:-4230}/api"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4230}:4200"
    volumes: *sync-source
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx; httpx.get('http://127.0.0.1:4200/api/health', timeout=5).raise_for_status()"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Converges the product schema, the artifact bucket, the work pool, and the
  # installed deployment. Registers no configuration. Safe to repeat, which is
  # what makes a rebuild-and-restart a one-liner.
  sync-bootstrap:
    profiles: ["sync"]
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
        # Absent when the bundled store is left out.
        required: false
      prefect-server:
        condition: service_healthy
    environment:
      <<: *sync-env
    volumes: *sync-source-and-ca

  sync-api:
    profiles: ["sync"]
    image: *sync-image
    build: *sync-build
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      INFRAHUB_SYNC_SERVICE_HOST: "0.0.0.0"
      # Required: the API does not start without the password of the `admin`
      # account, and refuses one shorter than 12 characters. A fixed development
      # value; ADMIN_ACCOUNT_PASSWORD replaces it.
      INFRAHUB_SYNC_ADMIN_ACCOUNT_PASSWORD: "${ADMIN_ACCOUNT_PASSWORD:-infrahub-sync-dev-password}"
      # The API token of `admin`, at least 16 characters; ADMIN_ACCOUNT_TOKEN replaces it.
      INFRAHUB_SYNC_ADMIN_ACCOUNT_TOKEN: "${ADMIN_ACCOUNT_TOKEN:-infrahub-sync-dev-token}"
      # Required: the key that encrypts stored credentials, 32 bytes, base64-encoded.
      # A fixed development value, the base64 text of `infrahub-sync-dev-encryption-key`;
      # never use it outside this stack. ENCRYPTION_KEY replaces it.
      INFRAHUB_SYNC_ENCRYPTION_KEY: "${ENCRYPTION_KEY:-aW5mcmFodWItc3luYy1kZXYtZW5jcnlwdGlvbi1rZXk=}"
      # The token of the `worker` account, another value than the token of `admin`.
      # A fixed development value; WORKER_TOKEN replaces it, here and on sync-worker.
      INFRAHUB_SYNC_WORKER_TOKEN: "${WORKER_TOKEN:-infrahub-sync-dev-worker-token}"
      # The Prefect UI this stack publishes on loopback; run responses and `runs show`
      # link each flow run to it.
      INFRAHUB_SYNC_PREFECT_UI_URL: "http://127.0.0.1:${PREFECT_PORT:-4230}"
      # Each health check's time limit, in seconds (1 to 60), and the live workers below which
      # GET /api/health answers 503. The healthcheck below stays on /api/version.
      INFRAHUB_SYNC_HEALTH_CHECK_TIMEOUT: "${INFRAHUB_SYNC_HEALTH_CHECK_TIMEOUT:-3}"
      INFRAHUB_SYNC_HEALTH_MIN_WORKERS: "${INFRAHUB_SYNC_HEALTH_MIN_WORKERS:-1}"
    ports:
      - "127.0.0.1:${SYNC_API_PORT:-8001}:8000"
    volumes: *sync-source-and-ca
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx; httpx.get('http://127.0.0.1:8000/api/version', timeout=5).raise_for_status()"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    # The smoke suite's no-source-read check runs a listener on the host and names it
    # through this route, so a validation that read the source would reach it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sync-worker:
    profiles: ["sync"]
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.worker", "--pool", "${WORK_POOL:-infrahub-sync}"]
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      PREFECT_WORKER_HEARTBEAT_SECONDS: "10"
      # The worker holds no source or destination credential. For each run it reads the
      # values of the stored credentials that the run names from the Sync API, at this
      # address, with the token of the `worker` account: the same value as on sync-api.
      INFRAHUB_SYNC_API_URL: "http://sync-api:8000"
      INFRAHUB_SYNC_WORKER_TOKEN: "${WORKER_TOKEN:-infrahub-sync-dev-worker-token}"
    volumes: *sync-source-and-ca
    # The only service that reaches a source or a destination. The root `docker-compose.yml`
    # carries no host route on purpose; here it lets a package reach a service published
    # on this machine that has no Compose network to join, and it costs nothing when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Looks only at this worker's own process: its event loop writes the alive file on a
    # timer that calls no other service, so an outage of PostgreSQL or Prefect leaves this
    # container healthy, and a hung process makes it unhealthy (spec 029, R-7). Docker runs no
    # health check in a paused container, so a paused container shows as paused, not unhealthy.
    # The command is WORKER_HEALTHCHECK_COMMAND in infrahub_sync/service/worker_alive.py.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-I"
        - "-c"
        - |-
          import os, sys, time
          path = os.path.join(os.environ.get("TMPDIR") or "/tmp", "infrahub-sync-worker-alive")
          try:
              fields = open(path, encoding="ascii").read().split()
          except (OSError, ValueError):
              sys.exit("worker alive file is missing or unreadable")
          if len(fields) != 2 or not all(field.isdigit() for field in fields):
              sys.exit("worker alive file is malformed")
          if time.time() - int(fields[0]) > max(3 * int(fields[1]), 30):
              sys.exit("worker alive file is older than its limit")
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

configs:
  # Read once, when Postgres initializes an empty data directory. Adding a database
  # here does not reach a volume that already exists: `docker compose down --volumes`
  # does.
  init-databases:
    content: |
      CREATE DATABASE infrahub_sync;
      CREATE DATABASE prefect;

volumes:
  postgres-data:
  object-store-data:
  # Empty, and never written: the default source of the read-only CA mount.
  sync-ca-certificates:
