---
# The zero-ceremony local stack:
#
#     uv run invoke start          # or: docker compose up --detach --wait
#
# This is NOT the supported deployment. That is deploy/compose/, which runs one
# digest-pinned image it was qualified against, behind the infrahub-sync-compose
# lifecycle wrapper. Nothing here is pinned or qualified, every credential below
# is a constant in a tracked file, and the image is whatever your working tree
# builds for your own architecture.
#
# Compose auto-loads a `.env` beside this file. The repository ignores `*.env`,
# so a stray root `.env` would feed this stack silently.
#
# Destination: none. A deployment starts with an empty configuration registry
# and reaches nothing until a package is registered. To sync against a local
# Infrahub, run `uv run invoke preview.up` and start this stack with
# INFRAHUB_API_TOKEN set; sync-worker already carries the host route.

name: infrahub-sync-dev

x-sync-build: &sync-build
  context: .
  dockerfile: Dockerfile

x-sync-image: &sync-image "infrahub-sync:dev"

x-sync-env: &sync-env
  INFRAHUB_SYNC_DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/infrahub_sync"
  INFRAHUB_SYNC_S3_BUCKET: "infrahub-sync"
  INFRAHUB_SYNC_S3_PREFIX: "infrahub-sync"
  INFRAHUB_SYNC_S3_ENDPOINT_URL: "http://object-store:9000"
  INFRAHUB_SYNC_S3_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "devaccesskey"
  AWS_SECRET_ACCESS_KEY: "devsecretkey"
  INFRAHUB_SYNC_SERVICE_WORK_POOL: "infrahub-sync"
  PREFECT_API_URL: "http://prefect-server:4200/api"

services:
  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "devpassword"
      POSTGRES_DB: "postgres"
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The two databases the stack needs, through the superuser. No owner roles, no
  # mounted script, no secret file. Not `docker-entrypoint-initdb.d`, which runs
  # only on a first init and would skip silently on a reused volume.
  db-bootstrap:
    image: "postgres:16-alpine"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: "postgres"
      PGUSER: "postgres"
      PGPASSWORD: "devpassword"
      PGDATABASE: "postgres"
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -eu
        for database in infrahub_sync prefect; do
          if [ "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$database'")" != "1" ]; then
            psql -c "CREATE DATABASE $$database"
          fi
        done

  object-store:
    image: "quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "devaccesskey"
      MINIO_ROOT_PASSWORD: "devsecretkey"
      MINIO_BROWSER: "off"
    volumes:
      - "object-store-data:/data"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  prefect-server:
    image: "prefecthq/prefect:3.8.1-python3.12"
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://postgres:devpassword@postgres:5432/prefect"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: "4200"
      PREFECT_SERVER_UI_API_URL: "http://127.0.0.1:4230/api"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4230:4200"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Converges the product schema, the artifact bucket, the work pool, and the
  # installed deployment. Registers no configuration. Safe to repeat, which is
  # what makes a rebuild-and-restart a one-liner.
  sync-bootstrap:
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.bootstrap"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      <<: *sync-env

  sync-api:
    image: *sync-image
    build: *sync-build
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      INFRAHUB_SYNC_SERVICE_HOST: "0.0.0.0"
      # Required: the API refuses to construct its principal resolver without
      # one, and rejects a token shorter than 16 characters.
      INFRAHUB_SYNC_SERVICE_BEARER_TOKENS: >-
        {"dev": {"token": "infrahub-sync-dev-token", "administrator": true}}
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "300"
      PREFECT_WORKER_QUERY_SECONDS: "10"
      INFRAHUB_API_TOKEN: "${INFRAHUB_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8030:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx; httpx.get('http://127.0.0.1:8000/version', timeout=5).raise_for_status()"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  sync-worker:
    image: *sync-image
    build: *sync-build
    command: ["python", "-m", "infrahub_sync.service.worker", "--pool", "infrahub-sync"]
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sync-env
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "300"
      PREFECT_WORKER_QUERY_SECONDS: "10"
      PREFECT_WORKER_HEARTBEAT_SECONDS: "10"
      INFRAHUB_API_TOKEN: "${INFRAHUB_API_TOKEN:-}"
      NETBOX_TOKEN: "${NETBOX_TOKEN:-}"
      NAUTOBOT_TOKEN: "${NAUTOBOT_TOKEN:-}"
    # The only service that reaches a destination. The shipped bundle carries no
    # host route on purpose; a dev stack whose destination is `preview.up` on
    # this laptop needs one, and it costs nothing when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  object-store-data:
