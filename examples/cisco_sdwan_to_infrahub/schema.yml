  uniqueness_constraints:
  - - name__value
    - instance
  include_in_menu: false
  attributes:
  - name: name
    kind: Text
    optional: false
    parameters:
      regex: ^[^&<>! "]{1,128}$
  - name: description
    kind: Text
    optional: true
  - name: cli_profile
    kind: Text
    label: CLI Profile
    optional: true
