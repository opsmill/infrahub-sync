# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# The four Sdwan nodes this example writes: instance, site, router and configuration group.
# Their definitions match a complete SD-WAN schema that also models feature templates and
# policies; relationships to those other nodes are left out, so this file loads on its own.
---
version: '1.0'
nodes:
- name: Instance
  namespace: Sdwan
  label: Instances
  display_label: name__value
  human_friendly_id:
  - name__value
  order_by:
  - name__value
  uniqueness_constraints:
  - - name__value
  inherit_from:
  - CoreArtifactTarget
  include_in_menu: false
  attributes:
  - name: name
    kind: Text
    optional: false
  - name: manager_version
    kind: Text
    optional: true
    parameters:
      regex: ^\d+(\.\d+)+$
  - name: management_ip_variable
    kind: Text
    label: Management IP Variable
    optional: true
    parameters:
      regex: ^[^"~`$&+,]{1,255}$
  - name: multi_region_fabric_enabled
    kind: Boolean
    optional: true
  relationships:
  - name: sites
    label: Sites
    peer: SdwanSite
    kind: Component
    cardinality: many
    identifier: sdwan__sites
    optional: true
  - name: configuration_groups
    label: Configuration Groups
    peer: SdwanConfigurationGroup
    kind: Component
    cardinality: many
    identifier: sdwan__configuration_groups
    optional: true
- name: Site
  namespace: Sdwan
  label: Site
  display_label: id_value__value
  human_friendly_id:
  - id_value__value
  order_by:
  - id_value__value
  uniqueness_constraints:
  - - id_value__value
    - instance
  include_in_menu: false
  attributes:
  - name: id_value
    kind: Number
    optional: false
    parameters:
      min_value: 1
      max_value: 4294967295
  relationships:
  - name: instance
    label: Instance
    peer: SdwanInstance
    kind: Parent
    cardinality: one
    identifier: sdwan__sites
    optional: false
  - name: routers
    label: Routers
    peer: SdwanRouter
    kind: Component
    cardinality: many
    identifier: sites__routers
    optional: true
- name: Router
  namespace: Sdwan
  label: Router
  display_label: chassis_id__value
  human_friendly_id:
  - chassis_id__value
  order_by:
  - chassis_id__value
  uniqueness_constraints:
  - - chassis_id__value
    - site
  include_in_menu: false
  attributes:
  - name: chassis_id
    kind: Text
    optional: false
  - name: management_ip_variable
    kind: Text
    label: Management IP Variable
    optional: true
    parameters:
      regex: ^[^"~`$&+,]{1,255}$
  - name: configuration_group
    kind: Text
    optional: true
    parameters:
      regex: ^[^<>!&" ]{1,128}$
  - name: configuration_group_deploy
    kind: Boolean
    optional: true
  - name: policy_group
    kind: Text
    optional: true
    parameters:
      regex: ^[^<>!&" ]{1,128}$
  - name: policy_group_deploy
    kind: Boolean
    optional: true
  - name: tags
    kind: List
    optional: true
  - name: topology_label
    kind: Text
    optional: true
