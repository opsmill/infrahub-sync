format_version: 1
configuration:
  name: from-cisco-aci

  # Replace both URLs with addresses the Sync worker can reach. The worker uses
  # these declared URLs; it does not read CISCO_APIC_URL or INFRAHUB_ADDRESS.
  # Each block names a stored credential. The Sync API stores the value and
  # releases it to the worker for a run; this file holds no value. An
  # administrator creates the two credentials before registering this package.
  # The first command asks for the password of the APIC account, and the
  # second for the Infrahub token, both without echo:
  #   uv run infrahub-sync credentials create apic-account --username <apic-username>
  #   uv run infrahub-sync credentials create infrahub-token
  source:
    name: aci
    credential: apic-account
    settings:
      url: "https://apic.example.com"
      api_endpoint: "api"
      verify: true

  destination:
    name: infrahub
    credential: infrahub-token
    settings:
      url: "http://localhost:8000"

  # order: omitted — infrahub-sync auto-computes tiers from schema_mapping.
  # Uncomment and edit only if you need to override the computed order:
  # order: [
  #   "OrganizationCustomer",
  #   "LocationMetro",
  #   "LocationBuilding",
  #   "DcimPhysicalDevice",
  #   "DcimPhysicalInterface",
  # ]

  schema_mapping:
    # ACI Tenants -> Organizations
    - name: OrganizationCustomer
      mapping: "class/fvTenant.json"
      identifiers: ["name", "customer_id"]
      fields:
        - name: name
          mapping: "fvTenant.attributes.name"
        - name: customer_id
          mapping: customer_id
      filters:
        - field: "fvTenant.attributes.name"
          operation: "not in"
          value: ["infra", "mgmt"]
      transforms:
        - field: customer_id
          expression: "CUST-{{ fvTenant.attributes.name.upper() }}"
        - field: description
          expression: "{{ fvTenant.attributes.descr or fvTenant.attributes.name }}"

    # Create parent location (City)
    - name: LocationMetro
      mapping: "class/fabricTopology.json"
      identifiers: ["name"]
      fields:
        - name: name
          static: "Munich"
        - name: shortname
          static: "MUC"

    # ACI Fabric Topology -> Location Building
    - name: LocationBuilding
      mapping: "class/fabricTopology.json"
      identifiers: ["name"]
      fields:
        - name: name
          mapping: "fabricTopology.attributes.fabricId"
        - name: shortname
          mapping: "fabricTopology.attributes.fabricId"
        - name: parent
          static: "Munich"
          reference: LocationMetro
      transforms:
        - field: name
          expression: "MUC-{{ fabricTopology.attributes.fabricId }}"
        - field: shortname
          expression: "MUC-{{ fabricTopology.attributes.fabricId }}"
        - field: description
          expression: "ACI Fabric {{ fabricTopology.attributes.fabricId }} in Munich"

    # ACI Fabric Nodes -> Devices (Spine/Leaf switches)
    - name: DcimPhysicalDevice
      mapping: "class/fabricNode.json"
      identifiers: ["name"]
      fields:
        - name: name
          mapping: "fabricNode.attributes.name"
        - name: serial
          mapping: "fabricNode.attributes.serial"
        - name: description
          mapping: "fabricNode.attributes.descr"
        - name: location
          static: "MUC-1"
          reference: LocationBuilding
        - name: role
          mapping: "fabricNode.attributes.role"
        - name: status
          mapping: "fabricNode.attributes.fabricSt"
      filters:
        - field: "fabricNode.attributes.fabricSt"
          operation: "=="
          value: "active"

    # ACI Physical Interfaces -> Interfaces
    - name: DcimPhysicalInterface
      mapping: "class/l1PhysIf.json"
      identifiers: ["device", "name"]
      fields:
        - name: name
          mapping: "l1PhysIf.attributes.id"
        - name: device
          mapping: "l1PhysIf.attributes.dn"
          reference: DcimPhysicalDevice
        - name: description
          mapping: "l1PhysIf.attributes.descr"
      transforms:
        - field: device
          expression: "{{ l1PhysIf.attributes.dn.split('/')[2].replace('node-', '') | aci_device_name }}"
        - field: status
          expression: "{{ 'active' if l1PhysIf.attributes.adminSt == 'up' else 'free' }}"
      filters:
        - field: "l1PhysIf.attributes.id"
          operation: "contains"
          value: "eth"
