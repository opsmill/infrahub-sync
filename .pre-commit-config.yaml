---
# Run locally with `uv run pre-commit install` then on each commit, or
# `uv run pre-commit run --all-files`. Mirrors the CI ruff gate so formatting
# and lint issues are caught before push. Keep the ruff rev in sync with the
# pinned `ruff` version in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # tests/data/ holds byte-exact fixtures compared verbatim by tests, so
      # neither hook may rewrite them. tests/data/cli_help_baseline.txt is
      # `--help` output padded to 80 columns with a trailing blank line;
      # stripping either makes its comparison fail on every padded line.
      - id: trailing-whitespace
        exclude: ^tests/data/
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: rumdl
        name: rumdl
        entry: uv run rumdl check
        language: system
        pass_filenames: false
        files: \.(md|mdx)$
