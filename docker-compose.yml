---
# The supported single-host Infrahub Sync deployment.
#
# Run it in three steps, with Docker Compose 2.24 or later (this file carries the
# database bootstrap script as a top-level `configs` entry with inline `content`):
#
#   1. Fetch this file for the release you want:
#        curl -fsSLO https://raw.githubusercontent.com/opsmill/infrahub-sync/<version>/docker-compose.yml
#   2. Write a `.env` beside it that sets every required credential below. Compose
#      stops before any container starts, naming the first one that is missing.
#   3. docker compose up -d
#
# Every Sync service runs `${INFRAHUB_SYNC_DOCKER_IMAGE}:${VERSION}`. `VERSION`
# defaults to this file's release; `INFRAHUB_SYNC_DOCKER_IMAGE` defaults to
# `registry.opsmill.io/opsmill/infrahub-sync`. The release tasks keep the `VERSION`
# pin in step with the package version. Every other image carries its digest, so a re-pointed
# tag cannot change what this file runs.
#
# Sync runs next to an Infrahub deployment that ships the Prefect version this
# release requires (Infrahub 1.11.3 and 1.11.4 ship Prefect 3.8.6), and uses two of its
# services: the task manager, which is Infrahub's Prefect server, and the task
# manager's PostgreSQL server, where Sync keeps its own `infrahub_sync` database.
# This file joins Infrahub's Compose network, named by INFRAHUB_NETWORK.
#
# Configurations live in Infrahub, in the kinds `schema/sync.yml` adds: load that
# schema into Infrahub before the first start (`infrahubctl schema load`). The API
# and the worker refuse to start when it is missing. Callers authenticate with their
# own Infrahub API token, and Sync checks their Infrahub permissions.
#
# Two properties this file exists to hold:
#
#   * the API and the worker share no mount, no writable volume, and no scratch
#     directory. Run state crosses between them through PostgreSQL, the object
#     store and Infrahub, never through a filesystem.
#   * only the object store keeps data across a restart here; Sync's database
#     lives on the task manager's PostgreSQL server, and its configurations and
#     run records in Infrahub, both outside this file. Every other writable path
#     is tmpfs and disappears with its container.
#
# Nothing here defaults a credential. The connection strings are built from the
# role, database and password settings, and stay overridable as a whole; a
# password used in them must be URL-safe, or the matching URL must be set instead.

# The image's three declared writable roots. A tmpfs mount takes its own
# ownership, so a bare mount would arrive root-owned and the runtime user could
# not write to it however the image created the directory underneath.
x-sync-scratch: &sync-scratch
  - "/var/lib/infrahub-sync:uid=10001,gid=10001,mode=0700"
  - "/var/lib/infrahub-sync/prefect:uid=10001,gid=10001,mode=0700"
  - "/tmp/infrahub-sync:uid=10001,gid=10001,mode=0700"

# Everything a Sync process needs to reach its durable state. The API, the
# worker, and the bootstrap job resolve these independently: they are given the
# same endpoints, never the same filesystem.
# The Infrahub that holds Sync's configurations and run records, and identifies
# callers. The token is the Sync service account's: it records versions, run
# mirrors and approvals, and is never a caller's.
x-sync-infrahub: &sync-infrahub
  INFRAHUB_SYNC_INFRAHUB_ADDRESS: "${INFRAHUB_SYNC_INFRAHUB_ADDRESS:-http://infrahub-server:8000}"
  INFRAHUB_SYNC_INFRAHUB_TOKEN: "${INFRAHUB_SYNC_INFRAHUB_TOKEN:?INFRAHUB_SYNC_INFRAHUB_TOKEN is required}"

x-sync-storage: &sync-storage
  INFRAHUB_SYNC_DATABASE_URL: "${INFRAHUB_SYNC_DATABASE_URL:-postgresql://\
    ${INFRAHUB_SYNC_PRODUCT_ROLE:-infrahub_sync}:\
    ${INFRAHUB_SYNC_PRODUCT_PASSWORD:?INFRAHUB_SYNC_PRODUCT_PASSWORD is required}\
    @${INFRAHUB_TASKMANAGER_DB_HOST:-task-manager-db}:5432/${INFRAHUB_SYNC_PRODUCT_DATABASE:-infrahub_sync}}"
  INFRAHUB_SYNC_S3_BUCKET: "${INFRAHUB_SYNC_S3_BUCKET:-infrahub-sync}"
  INFRAHUB_SYNC_S3_PREFIX: "${INFRAHUB_SYNC_S3_PREFIX:-infrahub-sync}"
  INFRAHUB_SYNC_S3_ENDPOINT_URL: "http://object-store:9000"
  INFRAHUB_SYNC_S3_REGION: "${INFRAHUB_SYNC_S3_REGION:-us-east-1}"
  AWS_ACCESS_KEY_ID: "${INFRAHUB_SYNC_S3_ACCESS_KEY:?INFRAHUB_SYNC_S3_ACCESS_KEY is required}"
  AWS_SECRET_ACCESS_KEY: "${INFRAHUB_SYNC_S3_SECRET_KEY:?INFRAHUB_SYNC_S3_SECRET_KEY is required}"
  INFRAHUB_SYNC_SERVICE_WORK_POOL: "${INFRAHUB_SYNC_WORK_POOL:-infrahub-sync}"
  # Infrahub's task manager, under the address and port settings Infrahub's own
  # Compose file uses.
  PREFECT_API_URL: "http://${INFRAHUB_WORKFLOW_ADDRESS:-task-manager}:${INFRAHUB_WORKFLOW_PORT:-4200}/api"
  # Optional, because Infrahub's task manager offers no API credential setting.
  # When the task manager is put behind one, each Sync process presents it; when
  # it is not, the task manager is protected by network isolation alone, and the
  # API and the worker say so at startup. The CLI service is never given it.
  PREFECT_API_AUTH_STRING: "${INFRAHUB_SYNC_PREFECT_AUTH_STRING:-}"

services:
  # Sync's owner role and database on the task manager's PostgreSQL server,
  # created as that server's administrator before anything connects as the
  # owner. Run twice it observes both and changes nothing. It never touches the
  # task manager's own `prefect` database.
  db-bootstrap:
    image: "postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685"
    restart: "no"
    networks: ["default", "infrahub"]
    environment:
      PGHOST: "${INFRAHUB_TASKMANAGER_DB_HOST:-task-manager-db}"
      PGUSER: "${INFRAHUB_TASKMANAGER_DB_USER:-postgres}"
      # The maintenance database every PostgreSQL server has, whatever the role is called.
      PGDATABASE: "postgres"
      PGPASSWORD: "${INFRAHUB_TASKMANAGER_DB_PASSWORD:?INFRAHUB_TASKMANAGER_DB_PASSWORD is required}"
      INFRAHUB_SYNC_PRODUCT_DATABASE: "${INFRAHUB_SYNC_PRODUCT_DATABASE:-infrahub_sync}"
      INFRAHUB_SYNC_PRODUCT_ROLE: "${INFRAHUB_SYNC_PRODUCT_ROLE:-infrahub_sync}"
      INFRAHUB_SYNC_PRODUCT_PASSWORD: "${INFRAHUB_SYNC_PRODUCT_PASSWORD:?INFRAHUB_SYNC_PRODUCT_PASSWORD is required}"
    configs:
      - source: db-bootstrap-script
        target: /usr/local/bin/databases.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/databases.sh"]

  # The former image wrote as root. Repair its volume once in a short-lived
  # service so the long-running server never needs root, even during startup.
  object-store-init:
    image: >-
      cgr.dev/chainguard/minio:latest-dev@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ "$$(stat -c %u:%g /data)" != "65532:65532" ]; then
          chown -R 65532:65532 /data;
        fi
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    volumes:
      - "object-store-data:/data"

  object-store:
    # Temporary Chainguard build while a maintained S3 store is selected; the old MinIO image requires authentication.
    image: >-
      cgr.dev/chainguard/minio:latest-dev@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
    restart: unless-stopped
    user: "65532:65532"
    command: ["server", "/data"]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: "${INFRAHUB_SYNC_S3_ACCESS_KEY:?INFRAHUB_SYNC_S3_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${INFRAHUB_SYNC_S3_SECRET_KEY:?INFRAHUB_SYNC_S3_SECRET_KEY is required}"
      # The browser console is a second published surface this topology does not
      # offer, so it is not started rather than merely left unpublished.
      MINIO_BROWSER: "off"
    volumes:
      - "object-store-data:/data"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--tries=1"
        - "--output-document=/dev/null"
        - "http://localhost:9000/minio/health/live"
      interval: 5s
      timeout: 5s
      retries: 30

  # One completion-style job converges everything durable this deployment needs:
  # the product schema, the artifact bucket, the process work pool, and the
  # installed deployment. It is safe to repeat, and it is the only place any of
  # that is created -- an API or a worker that converged bootstrap state on
  # startup would make every restart a write.
  #
  # It registers nothing. A started deployment holds an empty configuration
  # registry until an operator registers a package through the API, so this job
  # takes no configuration input and reaches no destination.
  sync-bootstrap:
    image: "${INFRAHUB_SYNC_DOCKER_IMAGE:-registry.opsmill.io/opsmill/infrahub-sync}:${VERSION:-3.0.0a5}"
    restart: "no"
    command: ["python", "-m", "infrahub_sync.service.bootstrap"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    networks: ["default", "infrahub"]
    environment:
      <<: *sync-storage
    read_only: true
    tmpfs: *sync-scratch

  sync-api:
    image: "${INFRAHUB_SYNC_DOCKER_IMAGE:-registry.opsmill.io/opsmill/infrahub-sync}:${VERSION:-3.0.0a5}"
    restart: unless-stopped
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    networks: ["default", "infrahub"]
    environment:
      <<: [*sync-storage, *sync-infrahub]
      # Loopback belongs to the host publication below. A container listening on
      # loopback alone would be unreachable from its own published port.
      INFRAHUB_SYNC_SERVICE_HOST: "0.0.0.0"
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "${INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS:-300}"
      PREFECT_WORKER_QUERY_SECONDS: "${PREFECT_WORKER_QUERY_SECONDS:-10}"
      # Optional, and empty when unset: a deployment starts before any configuration
      # exists, so there is no destination to hold a credential for yet. A
      # run that selects an absent value fails that run, not this start.
      INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN:-}"
    read_only: true
    tmpfs: *sync-scratch
    ports:
      - "${INFRAHUB_SYNC_BIND_ADDRESS:-127.0.0.1}:${INFRAHUB_SYNC_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import httpx; httpx.get('http://127.0.0.1:8000/version', timeout=5).raise_for_status()"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  sync-worker:
    image: "${INFRAHUB_SYNC_DOCKER_IMAGE:-registry.opsmill.io/opsmill/infrahub-sync}:${VERSION:-3.0.0a5}"
    restart: unless-stopped
    # A run reads its configuration version from Infrahub and resolves both
    # adapters from installed code, so this container is given no
    # configuration mount at all -- there is nothing on a worker filesystem for
    # a run to depend on.
    command:
      - "python"
      - "-m"
      - "infrahub_sync.service.worker"
      - "--pool"
      - "${INFRAHUB_SYNC_WORK_POOL:-infrahub-sync}"
    depends_on:
      sync-bootstrap:
        condition: service_completed_successfully
    networks: ["default", "infrahub"]
    environment:
      <<: [*sync-storage, *sync-infrahub]
      INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS: "${INFRAHUB_SYNC_RUN_ADMISSION_TTL_SECONDS:-300}"
      PREFECT_WORKER_QUERY_SECONDS: "${PREFECT_WORKER_QUERY_SECONDS:-10}"
      # The API ages a worker out of the live set after three missed heartbeats
      # or thirty seconds, whichever is longer. Ten seconds puts a stopped or
      # paused worker at that thirty-second floor instead of Prefect's ninety.
      PREFECT_WORKER_HEARTBEAT_SECONDS: "${PREFECT_WORKER_HEARTBEAT_SECONDS:-10}"
      # Optional for the same reason as on the API above.
      INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_INFRAHUB_API_TOKEN:-}"
      # The source credentials the bundled NetBox and Nautobot adapters resolve,
      # and the only service given either: a run is what consumes one, and the
      # worker is what runs one. Optional rather than required, because a
      # deployment that syncs neither source must still start -- and because a
      # token nothing selects has no reason to exist here. When a registered
      # package does select one, the resolver refuses an absent or empty value
      # by name, so an unset token fails that run rather than this container.
      INFRAHUB_SYNC_CREDENTIAL_NETBOX_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_NETBOX_TOKEN:-}"
      INFRAHUB_SYNC_CREDENTIAL_NAUTOBOT_TOKEN: "${INFRAHUB_SYNC_CREDENTIAL_NAUTOBOT_TOKEN:-}"
    read_only: true
    tmpfs: *sync-scratch

  # The operator's client, in the same image, behind a profile so no ordinary
  # start creates it. Call it as `docker compose run --rm --no-deps -T cli ...`:
  # it publishes nothing, waits for nothing, and keeps no volume. It reaches the
  # Sync API and nothing else, so it is given no storage, Prefect, source or
  # destination credential -- and no Docker socket, so no command run through it
  # can change the deployment it belongs to.
  #
  # The image's own non-root user runs it; nothing here overrides that.
  cli:
    image: "${INFRAHUB_SYNC_DOCKER_IMAGE:-registry.opsmill.io/opsmill/infrahub-sync}:${VERSION:-3.0.0a5}"
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["infrahub-sync"]
    environment:
      # The API on the deployment's own network, and the caller's own Infrahub API
      # token. Empty when unset, so Compose still runs the service; the client then
      # stops before it calls the API and names the missing token.
      INFRAHUB_SYNC_API_URL: "http://sync-api:8000"
      INFRAHUB_SYNC_TOKEN: "${INFRAHUB_SYNC_TOKEN:-}"
    read_only: true
    tmpfs: *sync-scratch

configs:
  # Converge Sync's owner role and database on the task manager's PostgreSQL
  # server, as its administrator. Safe to repeat: a second run finds both, sets
  # the role's password to the one in `.env`, and changes nothing else.
  #
  # Compose interpolates this content, so every shell `$` is written `$$`: the
  # script reads its values from the container environment at run time, and no
  # value is baked into the rendered file.
  db-bootstrap-script:
    content: |
      #!/bin/sh
      set -eu

      # The server belongs to Infrahub's Compose project, so no `depends_on` can
      # wait for it to accept connections. Wait here, bounded, instead.
      attempt=0
      until pg_isready --quiet; do
        attempt=$$((attempt + 1))
        if [ "$$attempt" -ge 60 ]; then
          echo "infrahub-sync: the task manager's PostgreSQL server is not accepting connections" >&2
          exit 1
        fi
        sleep 2
      done

      # `psql -c` interpolates nothing, so every operator-supplied value crosses
      # into SQL through a bound variable and PostgreSQL's own quoting functions.
      # A role name or password carrying a quote is then a value, never syntax.
      psql --set=ON_ERROR_STOP=1 --quiet \
        --set=role="$${INFRAHUB_SYNC_PRODUCT_ROLE}" \
        --set=password="$${INFRAHUB_SYNC_PRODUCT_PASSWORD}" \
        --set=database="$${INFRAHUB_SYNC_PRODUCT_DATABASE}" \
        --file=/dev/stdin <<'SQL'
      SELECT format(
        'CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'password'
      ) WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
      SELECT format(
        'CREATE DATABASE %I OWNER %I', :'database', :'role'
      ) WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
      -- A database of that name owned by another role is someone else's data on a
      -- server Sync shares with Infrahub: refuse rather than adopt it.
      SELECT format(
        'DO $$body$$ BEGIN RAISE EXCEPTION %L; END $$body$$',
        'infrahub-sync: database ' || :'database' || ' is owned by another role'
      ) WHERE EXISTS (
        SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba
        WHERE d.datname = :'database' AND r.rolname <> :'role'
      ) \gexec
      -- The password follows `.env`, so a regenerated credential takes effect on
      -- the next start instead of leaving the services unable to connect.
      SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'role', :'password') \gexec
      -- Other roles on the shared server cannot connect to Sync's database.
      SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'database') \gexec
      SQL

      echo "infrahub-sync: product role and database are present"

volumes:
  object-store-data:

networks:
  # Infrahub's Compose network, where its task manager and the task manager's
  # PostgreSQL server resolve by service name. Infrahub creates it; this file
  # only joins it.
  infrahub:
    external: true
    name: "${INFRAHUB_NETWORK:-infrahub_default}"
