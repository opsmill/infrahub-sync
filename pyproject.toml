[project]
name = "infrahub-sync"
version = "3.0.0a4"
description = "Infrahub-Sync is a versatile Python package that synchronizes data between a source and a destination system"
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "infrahub-sdk>=1.17,<2",
    "structlog>=25.1,<27.0",
    "typing-extensions>=4.4",
    "httpx>=0.27,<1",
    # 6.0.2 is the first release with a cp313 wheel. Below it a Python 3.13
    # lowest-direct resolution falls back to 6.0's source build, which no longer
    # builds against a current Cython.
    "pyyaml>=6.0.2,<7",
    # The `[redis]` extra is deliberately dropped: it caps `redis<5.0`, which is
    # unsatisfiable next to the optional `prefect` extra below
    # (prefect>=3.6 -> pydocket -> redis>=5). diffsync's cap is stale rather than
    # real — its redis store was verified functionally intact on redis-py 4.6.0,
    # 5.0, 6.4, 7.0 and 8.1.0 — and diffsync has no 3.x release raising it.
    "diffsync>=2.1,<3.0",
    # Declared DIRECTLY rather than through `diffsync[redis]`, because
    # `infrahub_sync/utils.py` imports `diffsync.store.redis.RedisStore`
    # unconditionally: without this entry `import infrahub_sync.utils` breaks for
    # every user. The floor is permissive on purpose (NOT `>=5`) so a downstream
    # consumer that still requires `diffsync[redis]` keeps resolving, at redis 4.6.0.
    "redis>=4.3,<9",
    "netutils>=1.12,<2.0",
    # Runtime (not only dev) dependency: `generate` formats its rendered Python with
    # `ruff format` so regeneration is byte-stable. A range, not an exact pin: an
    # exact pin would make this package unresolvable next to any project holding a
    # different ruff version. One minor series is Ruff's formatter-stability
    # boundary (style changes ship in minors, not patches), and the byte-identity
    # test enforces the contract against the locked version.
    "ruff>=0.15.5,<0.16",
    "tqdm>=4.67",
    # The first release carrying the fix; 23.0.0 is inside the series but predates
    # the patch. `tests/image/test_version_policy.py` enforces the refused releases.
    "pyarrow>=23.0.1,<24",
    "fsspec>=2024.6",
    "filelock>=3.13",
    "jinja2>=3.0.2",
    "typer>=0.23.1",
    "pydantic>=2.10.2,<3",
    "packaging>=22.0",
    "requests>=2.28.2",
    "urllib3>=1.26.9",
]

[project.urls]
Homepage = "https://opsmill.com"
Repository = "https://github.com/opsmill/infrahub"
Documentation = "https://docs.infrahub.app/sync/"

[project.scripts]
infrahub-sync = "infrahub_sync.cli:app"

[project.optional-dependencies]
# Optional orchestration integration. Only `infrahub_sync/orchestration/` imports
# prefect; a base install never loads it.
prefect = [
    "prefect==3.8.1",
]
# Sync HTTP service and worker profile (Python 3.11-3.13). Every runtime
# imported directly by `infrahub_sync.service` is declared here; the reusable
# Prefect integration is pinned to the reviewed DB-102/103/104 stack exactly.
# The previous `opsmill-prefect-extras` private Git pin is vendored instead: the
# package ships from this repository at `opsmill_prefect_extras/`, byte-identical to
# upstream commit 97465e75137f6121d0377cd637383cfb3530d734. See
# `opsmill_prefect_extras/VENDORED.md` for the freeze and re-adoption rules.
service = [
    "boto3>=1.35,<2; python_version >= '3.11'",
    "fastapi>=0.115,<1; python_version >= '3.11'",
    # `infrahubctl` ships in the SDK's `[ctl]` extra. It belongs to this profile,
    # not to `dev`: the image installs `--no-dev --extra service`, and a dev-only
    # placement leaves `infrahubctl` unable to start there for a missing
    # `ariadne_codegen`. The base install stays free of it.
    "infrahub-sdk[ctl]>=1.17,<2; python_version >= '3.11'",
    "prefect==3.8.1; python_version >= '3.11'",
    # prefect already resolves this transitively; declaring it directly is what lets
    # `infrahub_sync/adapters/prometheus.py` import `prometheus_client.parser`
    # outside a Prefect-bearing resolution too. The floor is where
    # `parser.text_string_to_metric_families` has long been stable (verified
    # against 0.26.0, the version currently resolved).
    "prometheus-client>=0.20,<1; python_version >= '3.11'",
    "psycopg[binary]>=3.2,<4; python_version >= '3.11'",
    # The SDKs the bundled NetBox and Nautobot source adapters import at module
    # top. pynetbox 7.6 is where NetBox's v2 (`nbt_`) tokens are supported;
    # pynautobot stays below 3, whose server line and default many-to-many
    # inclusion differ from what these adapters extract. Both bounds select a
    # packaging dependency, not a supported source-server profile.
    "pynautobot>=2.5,<3; python_version >= '3.11'",
    "pynetbox>=7.6,<8; python_version >= '3.11'",
    "uvicorn>=0.34,<1; python_version >= '3.11'",
]
# The SDK the bundled IP Fabric source adapter imports at module top, kept out of
# `service` (and so out of the default Sync image) because every current release —
# down to 7.5.2, well below this floor — depends unconditionally on `niquests`,
# which in turn requires `urllib3-future`. `urllib3-future` ships a `.pth` hook that
# replaces the real `urllib3` package in `site-packages` at interpreter start, for
# every process in the image, not just this adapter — moving every other
# requests-based adapter (`pynetbox`, `pynautobot`, the generic REST
# adapter) onto it too. No niquests-free release exists to declare instead (checked
# 7.5.2 through 8.1.0b0 on PyPI). A custom image that needs the IP Fabric adapter
# installs this extra explicitly; see `docs/docs/adapters/ipfabric.mdx`.
ipfabric = [
    # 8.0.1 (verified here) accepts `base_url` and `auth` as `IPFClient`
    # pydantic-settings fields; the upper bound holds to the current major, since a
    # future one is not verified. `IPFClient`'s field is `verify`, not `verify_ssl`;
    # the adapter renames it before construction, so a configured `verify_ssl`
    # setting is honored, not silently dropped.
    "ipfabric>=8.0,<9; python_version >= '3.11'",
]
# The Slurp'it adapter uses the async SDK API. Version 0.9.52 is the first
# inspected release with async device/planning/site calls, Planning.slug,
# search_plannings(limit=...), and api(verify=...); 0.9.47 lacks verify.
# The 0.9 line requires httpx<0.28. Keep it separate from service so the
# default image retains its current httpx. These extras need separate uv
# resolutions because the SDK's httpx<0.28 would lower service's httpx.
slurpit = [
    "slurpit-sdk>=0.9.52,<0.10; python_version >= '3.11'",
]
dev = [
    "yamllint>=1.37.1",
    "pylint>=3.3",
    "ipython>=8.18",
    "pytest-asyncio>=0.24",
    "prek>=0.5.0",
    "types-toml>=0.10",
    "types-ujson>=5.10",
    "typer-cli>=0.23",
    "invoke>=2.2.1,<4",
    "types-PyYAML>=6.0.12",
    "ruff==0.15.5",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.3",
    "ty==0.0.32",
    "types-python-slugify>=8.0.2.20240310",
    "towncrier>=24.8,<27",
    "rumdl>=0.1.68",
]

[tool.uv]
conflicts = [[{ extra = "service" }, { extra = "slurpit" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `opsmill_prefect_extras` is a vendored copy of the private upstream package,
# byte-identical at its original import name so nothing in this repository or its
# tests rewrites imports; see `opsmill_prefect_extras/VENDORED.md`.
packages = ["infrahub_sync", "opsmill_prefect_extras"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pylint.general]
extension-pkg-whitelist = [
    "pydantic",
    "ujson",
]
ignore-paths = [
    ".venv",
    ".tox",
    ".git",
    "env",
    "build",
    "dist",
    "examples",
]

[tool.pylint.format]
disable = "logging-fstring-interpolation"

[tool.pylint.basic]
# No docstrings required for private methods (Pylint default), or for test_ functions.
no-docstring-rgx="^(_|test_)"

[tool.pylint.messages_control]
# Line length is enforced by Black, so pylint doesn't need to check it.
# Pylint and Black disagree about how to format multi-line arrays; Black wins.
# assigning-non-slot,no-member,unsupported-membership-test,unsubscriptable-object,unsupported-assignment-operation,not-an-iterable
# are disabled because of our move to pydantic 2, pylint does not seem to respect the type hint for pydantic 2 model fields.
disable = """,
    line-too-long,
    missing-module-docstring,
    missing-function-docstring,
    missing-class-docstring,
    consider-using-from-import,
    invalid-name,
    too-many-arguments,
    too-many-locals,
    keyword-arg-before-vararg,
    too-few-public-methods,
    too-many-instance-attributes,
    fixme,
    consider-using-f-string,
    protected-access,
    import-self,
    wrong-import-order,
    assigning-non-slot,
    no-member,
    unsupported-membership-test,
    unsubscriptable-object,
    unsupported-assignment-operation,
    not-an-iterable,
    multiple-statements,
    """

[tool.pylint.miscellaneous]
notes = """,
    FIXME,
    XXX,
    """

[tool.pylint.similarities]
min-similarity-lines = 20

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests"
]
markers = [
    "integration: tests that require a running Infrahub instance. Skipped by default; opt in with -m integration and INFRAHUB_ADDRESS + INFRAHUB_API_TOKEN set. The remote-run test additionally needs a live Prefect server (PREFECT_API_URL) and a separately started served deployment (`python -m infrahub_sync.orchestration.serve`, from the repository root).",
    "preview: end-to-end smoke tests against a running preview environment (`invoke preview.up`). Opt in with -m preview; each test skips when the environment is not reachable.",
    "docker: container-image tests that run the built image through a Docker daemon. Opt in with -m docker; they are driven by `invoke image.smoke`, which exports the built image from the retained layout, loads it, and names it to them.",
    "builder: warm-builder freshness tests that run two real image builds through a Docker daemon. Opt in with -m builder; they are driven by `invoke image.freshness`, which names the shared buildx builder to them.",
    "compose: Compose bundle lifecycle tests that run a real deployment through a Docker daemon. Opt in with -m compose; they are driven by `invoke compose.lifecycle`, which names the already-built image to them. They share one session-scoped stack and run single-process.",
    "timeout: bounds a test's wall-clock runtime via pytest-timeout; the test fails instead of hanging past the given number of seconds.",
]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten",
    "ignore:the imp module is deprecated",
    "ignore:Deprecated call to",
]
addopts = "-vs --cov-report term-missing --cov-report xml --dist loadscope"
strict_markers = true

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".tox",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
    # Vendored byte-identical upstream code and its upstream tests; the freeze rule in
    # opsmill_prefect_extras/VENDORED.md forbids local rewrites, so Ruff must not
    # reformat or lint them to this repository's profile. ty still checks the vendored
    # package; only the vendored tests are excluded from ty (see [tool.ty.src]).
    "opsmill_prefect_extras",
    "tests/vendored_prefect_extras",
]


[tool.ruff.lint]
preview = true

select = ["ALL"]

ignore = [
    "D",        # pydocstyle
    "DOC",      # pydoclint
    "CPY",      # flake8-copyright
    "ISC",      # flake8-implicit-str-concat
    "COM812",   # missing-trailing-comma
    "RUF067",   # __init__ module should only contain docstrings and re-exports
]

#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub"]
# The vendored package keeps its upstream (third-party) import classification so
# consumer import blocks stay byte-stable across vendoring and later re-adoption.
known-third-party = ["opsmill_prefect_extras"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 33

[tool.ruff.lint.per-file-ignores]

# The clean-host checks are scripts a container runs, not modules this repository
# imports. They are mounted flat at one path and executed by name, so that path is
# their import root and their standard output is how they report to the driver.
"tests/compose/clean_host/checks/*.py" = [
    "INP001",  # File is part of an implicit namespace package
    "T201",  # `print` found
]

# The NetBox dataset seeders are standalone scripts invoked by path (`netbox.seed`
# shells out to them), not modules this repository imports, and their printed JSON
# summary is the operator-facing result. The fixed dataset they build is a long, flat
# sequence of literal objects rather than a reusable API, so the usual complexity and
# magic-value limits do not fit it either.
"development/netbox/datasets/*.py" = [
    "INP001",  # File is part of an implicit namespace package
    "T201",  # `print` found
    "PLR0912",  # Too many branches
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
]

"examples/**.py" = [
    "FIX002",    # Line contains TODO, consider resolving the issue
    "PLR0904",  # Too many public methods
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR0916",  # Too many Boolean expressions
    "PLR0917",  # Too many positional arguments
    "PLR1702",  # Too many nested blocks
    "TC003",  # Move standard library import `collections.abc.Mapping` into a type-checking block
    "TD002",    # Missing author in TODO
    "TD003",    # Missing issue link on the line following this TODO
    "RUF012", # Mutable class attributes should be annotated

]

"infrahub_sync/**.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN001", # Missing type annotation for function argument
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs`
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "ANN206", # Missing return type annotation for classmethod
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "B008",     # Do not perform function call `Depends` in argument defaults;
    "B904",     # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "FBT001",   # Boolean-typed positional argument in function definition
    "FBT002",   # Boolean default positional argument in function definition
    "FIX002",    # Line contains TODO, consider resolving the issue
    "N805",     # First argument of a method should be named self
    "PERF203",  # `try`-`except` within a loop incurs performance overhead
    "PERF401",  # Use a list comprehension to create a transformed list
    "PLC0415",  # `import` should be at the top-level of a file
    "PLR0904",  # Too many public methods
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR0917",  # Too many positional arguments
    "PLR1702",  # Too many nested blocks
    "PLR2004",  # Magic value used in comparison this could possibly be fine in the tests folders
    "PLR6201",  # Use a `set` literal when testing for membership
    "PLR6301",  # Method could be a function, class method, or static method
    "PLW3201",  # Bad or misspelled dunder method name `__init_subclass_with_meta__`
    "RET503",   # Missing explicit `return` at the end of function able to return non-`None` value
    "RET504",   # Unnecessary assignment before `return` statement
    "S101",     # Use of `assert` detected
    "S105",     # Possible hardcoded password assigned to: "REGEX_PASSWORD"
    "S701",     # By default, jinja2 sets `autoescape` to `False`. Consider using `autoescape=True`
    "SLF001",   # Private member accessed
    "TD002",    # Missing author in TODO
    "TD003",    # Missing issue link on the line following this TODO
    "UP007",    # Use X | Y for type annotations
]

"infrahub_sync/adapters/**.py" = [
    "INP001", # Is part of an implicit namespace package
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "C416", # Unnecessary `list` comprehension
]

"tests/**.py" = [
    "PGH003",  # Use specific rule codes when ignoring type issues
    "S101",    # Use of `assert` detected (standard in pytest)
    "PLC0415", # `import` should be at the top-level of a file
    "TC003",   # Path used only in annotations — acceptable in test files
    "ANN001",  # Missing type annotation for function argument
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method
    "PLR2004", # Magic value used in comparison — common in assertions
    "SLF001",  # Private member accessed — tests legitimately probe internals
    "PT011",   # pytest.raises match — broad raises acceptable in tests
    "B903",    # Class could be dataclass — test helpers don't need it
    "B905",    # zip() without strict= — relaxed in tests
]

"tasks/**.py" = [
    "T201",    # print() is standard for invoke task status messages
]

[tool.ty]

[tool.ty.src]
# tests/vendored_prefect_extras is frozen byte-identical upstream test code (see
# opsmill_prefect_extras/VENDORED.md) and is not held to this repository's checks;
# the vendored package itself stays type-checked. Configured here so every ty
# entry point — local, invoke, and CI's inlined commands — agrees.
exclude = ["examples/**", "tests/vendored_prefect_extras/**"]

[tool.ty.environment]
python-version = "3.10"

[tool.rumdl]
# Migrated from the former .markdownlint.yml. Disable the same rules that config
# turned off so the existing docs keep passing; keep MD041 (first-line heading)
# and default table style, matching prior behaviour.
disable = [
    "MD013",  # line length — handled by prose, not a hard limit
    "MD014",  # dollar signs before shell commands
    "MD024",  # duplicate headings — reused in tabbed instructions
    "MD029",  # ordered-list numbering style
    "MD033",  # inline HTML — needed for MDX/Docusaurus
    "MD034",  # bare URLs
    "MD045",  # image alt text
    "MD047",  # single trailing newline
]
exclude = [
    ".agents/**",
    ".claude/**",
    ".codex/**",
    "changelog/**",
    # Archived spec artifacts are a historical record, and `rumdl fmt` loses text in
    # them (see docs/docs/develop/knowledge/quality-gates.md). Excluded from BOTH `check` and `fmt`
    # so `invoke format` cannot rewrite them.
    "dev/specs/**",
    "docs/node_modules/**",
    "docs/docs/reference/cli.mdx",  # generated by `invoke generate-doc` (typer-cli)
    "examples/**",
]

[tool.rumdl.MD007]
indent = 4

[tool.towncrier]
# `infrahub_sync` does not expose `__version__`, so `package` is intentionally
# omitted; pass `--version X.Y.Z` to `towncrier build` at release time.
directory = "changelog"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [Infrahub Sync - v{version}](https://github.com/opsmill/infrahub-sync/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/opsmill/infrahub-sync/issues/{issue})"
orphan_prefix = "+"
template = "changelog/towncrier.md.template"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "housekeeping"
name = "Housekeeping"
showcontent = true
