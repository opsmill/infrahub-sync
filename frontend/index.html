<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Infrahub Sync</title>
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link
      rel="preload"
      href="https://rsms.me/inter/font-files/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='1' width='18' height='18' rx='5' fill='%23164e63'/%3E%3Ccircle cx='6' cy='10' r='1.75' fill='white'/%3E%3Ccircle cx='14' cy='10' r='1.75' fill='white'/%3E%3Cpath d='M7.75 10h4.5' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Follows the system light or dark setting before the first paint, so the page does not flash. -->
    <script>(()=> {var d=document.documentElement,m=matchMedia("(prefers-color-scheme: dark)");function a(){d.classList.toggle("dark",m.matches)}a();m.addEventListener("change",()=> {d.classList.add("no-transitions");a();requestAnimationFrame(()=> {requestAnimationFrame(()=> {d.classList.remove("no-transitions")})})})})()</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
