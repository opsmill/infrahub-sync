# Records left out and problems that the v2-to-V3 plan gate accepts (spec 012 FR-023).
#
# Each entry is a record that the destination schema cannot represent: Infrahub identifies its
# kind by fewer fields than NetBox, so several NetBox records map to one Infrahub node. Records
# that depend on a listed record, and deletes of nodes of the same kinds, are accepted without
# their own entry. List one only with a reason a reviewer accepts.
#
# Entry format:
#
#   - list: <left_out or problem>
#     type: <first column of `runs plan --left-out` or `--problems`>
#     kind: <destination node kind>
#     identity: <identity as the list prints it>
#     reason: <why the record cannot be represented>
#
# Written from the first complete gate run on 2026-11-13: v2 2.0.1, the pinned NetBox demo
# dataset, spec 020 at 602cabab.
- list: left_out
  type: has_problem
  kind: DcimDevice
  identity: "location=IDF117,ncsu-117 name=PP:MDF"
  reason: >-
    NetBox device names are unique only together with the site and the rack; Infrahub identifies a
    device by its name only, so the three devices named 'PP:MDF' map to one node, which v2 merged
