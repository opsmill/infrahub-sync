---
# Test-only Compose override. It is deliberately not part of the shipped file.
#
# The mandatory managed plan, apply, and sync rows need a real Infrahub, and the
# one this suite uses is the pinned 1.11.9 fixture the local development stack
# already starts, published on a host port. Reaching it from inside the deployment's
# private network needs a route to the host, which the shipped topology has no
# reason to carry: a deployment's destination is a real address it resolves like
# any other.
#
# `prefect-server` needs nothing here: it runs the image under test through the
# same INFRAHUB_SYNC_DOCKER_IMAGE and VERSION settings as the Sync services, and
# the suite reaches it on the deployment's own network, not on a host port.
services:
  # The one service that reaches the destination: the worker that runs against
  # it. The API resolves runs out of PostgreSQL and dispatches through Prefect,
  # and the bootstrap job reaches no destination at all.
  sync-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
