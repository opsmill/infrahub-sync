---
# The two destination kinds the keyed-write row needs, and why each field is what
# it is. The shape is the one `tests/integration/test_infrahub_keyed_write_integration.py`
# exercises against a live Infrahub. It is not
# ported from the offline adapter suite: that drives a recording client with a
# locally constructed `NodeSchemaAPI`, whose `human_friendly_id` stays unset
# forever, while a live destination reports whatever it computed instead.
#
# `CleanDevice`'s human-friendly ID crosses the `site` relationship, and the SDK
# renders no key for that shape: the peer arrives as a resolved node id,
# `get_path_value` cannot walk to `site__name__value`, and no `hfid` is rendered.
# That alone is fine — the server matches on the components in `data`. What this
# row induces is the case that is not: the configuration's identifiers name `name`
# only, so `site` is never in the operation's identity, the create cannot be proven
# to carry every component, and planning refuses it before a run reaches a write.
#
# `CleanSite`'s own identifier is all-direct, so it renders a key and is writable.
# The refusal under test is `CleanDevice`'s alone.
#
# `CleanDevice.name` is deliberately not unique. Uniqueness is not the key here,
# and a unique attribute is one more thing a destination could derive an
# identifier from -- which is exactly how the previous mechanism died.
#
# This is qualification evidence. It is never part of the shipped bundle.
version: "1.0"

nodes:
  - name: Site
    namespace: Clean
    label: Site
    description: The peer whose identifier is direct, so it is both writable and resolvable.
    include_in_menu: false
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000

  - name: Device
    namespace: Clean
    label: Device
    description: The kind whose create cannot be proven keyed, because its identifiers omit an HFID component.
    include_in_menu: false
    human_friendly_id:
      - site__name__value
      - name__value
    attributes:
      - name: name
        kind: Text
        unique: false
        order_weight: 1000
    relationships:
      - name: site
        peer: CleanSite
        cardinality: one
        kind: Attribute
        optional: false
        order_weight: 2000
