---
extends: default

ignore: |
  /.venv
  /examples
  # Byte-for-byte copies of the v2 2.0.2 and v1 1.6.1 example configurations, kept
  # unedited as conversion input (see tests/data/v2_examples/README.md).
  /tests/data/v2_examples
  /docs/node_modules
  /docs/pnpm-lock.yaml
  /frontend/node_modules
  /frontend/pnpm-lock.yaml
  # The opsmill/infrahub submodule that holds the design system; linted in its own repository.
  /frontend/vendor
  # Downloaded schemas and the generated package for the local NetBox demo check;
  # gitignored and not authored here.
  /.netbox
  # Local git worktrees of other branches; each is linted in its own checkout.
  /.worktrees
  # Vendored/agentic tooling trees (spec-kit engine + agent source-of-truth +
  # adapters). Managed by spec-kit / the agentic structure, not hand-authored
  # here, so they follow their own formatting conventions.
  /.specify
  /.agents
  /.claude
  /.codex

rules:
  new-lines: disable
  comments-indentation: disable
  truthy:
    check-keys: false
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
