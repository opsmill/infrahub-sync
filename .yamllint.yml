---
extends: default

ignore: |
  /.venv
  /examples
  /docs/node_modules
  /docs/pnpm-lock.yaml
  # Agent tooling trees: the agent source-of-truth plus the Claude and Codex
  # aliases that point at it. Managed by the agentic structure, not
  # hand-authored here, so they follow their own formatting conventions.
  /.agents
  /.claude
  /.codex

rules:
  new-lines: disable
  comments-indentation: disable
  truthy:
    check-keys: false
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
