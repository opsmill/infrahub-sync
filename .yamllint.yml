---
extends: default

ignore: |
  /.venv
  /examples
  /docs/node_modules
  /docs/pnpm-lock.yaml
  # Downloaded schemas and the generated package for the local NetBox demo check;
  # gitignored and not authored here.
  /.netbox
  # Agent tooling trees: the agent source-of-truth plus the Claude and Codex
  # aliases that point at it. Managed by the agentic structure, not
  # hand-authored here, so they follow their own formatting conventions.
  /.agents
  /.claude
  /.codex
  # Installed Spec Kit manifests and extension fixtures retain upstream YAML style.
  /.specify
  # Local checkouts are independent repositories with their own lint profiles.
  /.worktrees

rules:
  new-lines: disable
  comments-indentation: disable
  truthy:
    check-keys: false
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
